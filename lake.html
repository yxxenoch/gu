function ensureScreenCache(index,sw,sh){const im=images[index];const key=index+':'+Math.round(sw)+'x'+Math.round(sh)+':'+(im?im.src:'none');if(photoCache.has(key))return photoCache.get(key);const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(sw));cv.height=Math.max(1,Math.round(sh));const q=cv.getContext('2d');q.fillStyle=grad(q,0,0,cv.width,cv.height,[[0,'#dceaf7'],[.45,'#93b0d2'],[1,'#dcecf8']]);q.fillRect(0,0,cv.width,cv.height);if(im){q.save();q.beginPath();q.rect(0,0,cv.width,cv.height);q.clip();imageBox(q,im,0,0,cv.width,cv.height,'cover');q.restore()}else{q.fillStyle='#335879';q.textAlign='center';q.fillText('湖光 · 截图 '+(index+1),cv.width/2,cv.height*.34);q.font=Math.max(10,cv.width*.18)+'px Georgia';q.fillText('✦',cv.width/2,cv.height*.55);q.strokeStyle='#6f8fb6aa';for(let j=0;j<7;j++){q.beginPath();q.moveTo(cv.width*.15,cv.height*(.7+j*.025));q.lineTo(cv.width*.85,cv.height*(.7+j*.025));q.stroke()}}photoCache.set(key,cv);if(photoCache.size>16)photoCache.delete(photoCache.keys().next().value);return cv}
function drawScreens(c,w,h){const rects=screenRects(w,h),line=w*.003;rects.forEach((r,i)=>{const cv=ensureScreenCache(i,r.w,r.h);c.save();c.shadowColor='#1a395366';c.shadowBlur=w*.012;c.shadowOffsetY=w*.004;c.fillStyle='#ffffffeb';c.fillRect(r.x-line,r.y-line,r.w+line*2,r.h+line*2);c.shadowColor='transparent';c.drawImage(cv,r.x,r.y,r.w,r.h);c.restore()});return rects}
function drawReflections(c,w,h,rects,t){if(!state.refl)return;const base=h*.662,depth=h-base,level=state.reflection/100,speed=state.speed/80;rects.forEach((r,i)=>{const cv=ensureScreenCache(i,r.w,r.h),height=Math.min(depth*.79,r.h*.78),step=Math.max(2,w*.004);c.save();c.globalAlpha=level*.59;for(let y=0;y<height;y+=step){const fade=Math.pow(1-y/height,1.18),sourceHeight=Math.max(.5,step*r.h/height);let sy=r.h-(y+step)/height*r.h;sy=clamp(sy,0,r.h-sourceHeight);const wave=Math.sin(y*.047+t*2.1*speed+i*1.9)*w*.009*state.wave/65 +Math.sin(y*.11-t*1.3*speed+i)*w*.004*state.wave/65;c.globalAlpha=level*.68*fade;c.drawImage(cv,0,sy,cv.width,sourceHeight,r.x+wave,r.y+r.h+y,r.w,step+1)}c.restore()});const tint=grad(c,0,base,0,h,[[0,'#b5cee555'],[.45,'#9ebed230'],[1,'#5278a55f']]);c.fillStyle=tint;c.fillRect(0,base,w,depth)}

const lakeTextures=new Map();
function lakeHash(x,y,k){let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(k,2246822519);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function lakeNoise(x,y,k){
 const xi=Math.floor(x),yi=Math.floor(y),a=x-xi,b=y-yi,u=a*a*(3-2*a),v=b*b*(3-2*b);
 const p=lakeHash(xi,yi,k),q=lakeHash(xi+1,yi,k),r=lakeHash(xi,yi+1,k),t=lakeHash(xi+1,yi+1,k);
 return (p+(q-p)*u)*(1-v)+(r+(t-r)*u)*v;
}
function makeLakeTexture(){
 const tex=document.createElement('canvas');tex.width=1024;tex.height=450;
 const q=tex.getContext('2d'),frame=q.createImageData(tex.width,tex.height),p=frame.data;
 for(let y=0;y<tex.height;y++){
  const v=y/tex.height,depth=Math.pow(v,.7);
  for(let x=0;x<tex.width;x++){
   const u=x/tex.width,off=(lakeNoise(u*2.8,v*15,4)-.5)*.33;
   const a=lakeNoise(u*4.2+off,v*(83-25*depth),5),
         b=lakeNoise(u*10.6-off*.7,v*(142-40*depth),12),
         d=lakeNoise(u*26.0+off,v*(210-70*depth),23),
         broad=lakeNoise(u*1.75,v*(32-9*depth),29);
   const light=a*.47+b*.24+d*.11+broad*.18;
   const sparkle=Math.max(0,(light-.48)*4.4),shadow=Math.max(0,(.47-light)*3.1);
   const mask=Math.min(.86,sparkle*(.62+depth*.32)+shadow*.30);
   const pos=(y*tex.width+x)*4,bright=sparkle>=shadow;
   p[pos]=bright?240:57;p[pos+1]=bright?248:94;p[pos+2]=bright?255:148;
   p[pos+3]=Math.round(255*mask*(bright?.70:.52));
  }
 }
 q.putImageData(frame,0,0);return tex;
}
function drawWater(c,w,h,t){
 if(!state.ripples)return;
 const yy=h*.662,dh=h-yy,detail=state.detail/100,intensity=state.wave/100,speed=state.speed/80;
 if(!lakeTextures.has('water'))lakeTextures.set('water',makeLakeTexture());
 const tex=lakeTextures.get('water');
 c.save();c.beginPath();c.rect(0,yy,w,dh);c.clip();
 const x1=Math.sin(t*.48*speed)*w*.011,x2=Math.sin(t*.31*speed+1.7)*w*.018;
 c.globalAlpha=.37+detail*.45;
 c.drawImage(tex,0,0,tex.width,tex.height,x1-w*.018,yy,w*1.036,dh);
 c.globalCompositeOperation='soft-light';c.globalAlpha=.16+intensity*.24;
 c.drawImage(tex,0,0,tex.width,tex.height,-x2-w*.02,yy,w*1.04,dh);
 c.globalCompositeOperation='source-over';
 const veil=grad(c,0,yy,0,h,[[0,'#ffffff13'],[.17,'#ffffff06'],[.58,'#92b2d210'],[1,'#466c951a']]);
 c.globalAlpha=.9;c.fillStyle=veil;c.fillRect(0,yy,w,dh);c.restore();
}
function drawSnow(c,w,h,t){if(!state.snow||!state.snowAmount)return;const level=state.snowAmount/100;c.save();const max=Math.min(snowflakes.length,Math.round(160+level*820)),motion=state.snowMotion?t*state.speed/85:0;for(let i=0;i<max;i++){const f=snowflakes[i],x=(((f.x+motion*.003*f.drift+Math.sin(motion*.4+f.phase)*.006)%1)+1)%1*w,y=(((f.y+motion*.015*f.drift)%1)+1)%1*h,r=f.r*w/800;const a=f.a*(.42+level*.83);if(f.soft){c.save();c.filter='blur('+Math.max(.7,r*.65)+'px)';c.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';c.beginPath();c.arc(x,y,r*1.7,0,7);c.fill();c.restore()}else{c.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';c.beginPath();c.arc(x,y,r,0,7);c.fill()}}c.restore()}
function draw(c,w,h,t){c.clearRect(0,0,w,h);drawBackground(c,w,h);const rects=drawScreens(c,w,h);drawReflections(c,w,h,rects,t);drawWater(c,w,h,t);drawTitle(c,w,h);drawSnow(c,w,h,t)}
function drawPreview(t){draw(ctx,W,H,t);const now=performance.now();if(now-floatLast>1000&& !$('floating').hidden){$('floatImage').src=canvas.toDataURL('image/jpeg',.56);floatLast=now}if(!$('modal').hidden)$('zoomImage').src=canvas.toDataURL('image/jpeg',.8);}
function tick(now){raf=requestAnimationFrame(tick);if(paused||busy||document.hidden)return;if(now-last<55)return;last=now;drawPreview((now-epoch)/1000)}
function refresh(){drawPreview(paused?0:(performance.now()-epoch)/1000)}
function stateSnapshot(){return JSON.stringify({state,files:files.map(f=>f?{name:f.name,url:null}:null)})}
function pushHistory(){history.push(JSON.stringify(state));if(history.length>40)history.shift();redo=[]}
function restoreSnapshot(s){Object.assign(state,JSON.parse(s));syncUI();refresh()}
function syncUI(){for(const [k,v] of Object.entries(state)){const el=$(k);if(!el)continue;if(el.type==='checkbox')el.checked=!!v;else el.value=v}for(const o of document.querySelectorAll('output[data-for]'))o.textContent=$(o.dataset.for).value;$('numBadge').textContent=state.count+' 张展示';buildSlots()}
function bind(){for(const [k,v] of Object.entries(state)){const el=$(k);if(!el)continue;const event=el.type==='range'?'input':el.type==='text'||el.tagName==='TEXTAREA'?'input':'change';el.addEventListener(event,()=>{if(busy)return;clearTimeout(historyTimer);if(!historyTimer)pushHistory();historyTimer=setTimeout(()=>historyTimer=null,350);state[k]=el.type==='checkbox'?el.checked:typeof v==='number'?Number(el.value):el.value;if(k==='count'){buildSlots();$('numBadge').textContent=state.count+' 张展示'}const o=document.querySelector('output[data-for="'+k+'"]');if(o)o.textContent=el.value;refresh()})}}
function buildSlots(){const box=$('slots');box.replaceChildren();for(let i=0;i<state.count;i++){const wrap=document.createElement('div');wrap.className='slot';const line=document.createElement('div');line.className='slot-head';const label=document.createElement('b');label.textContent='第 '+(i+1)+' 张';const btns=document.createElement('span');btns.className='slot-actions';for(const [mark,d] of [['←',-1],['→',1]]){const b=document.createElement('button');b.type='button';b.textContent=mark;b.title='调整截图顺序';b.disabled=i+d<0||i+d>=state.count;b.onclick=()=>{if(busy)return;[files[i],files[i+d]]=[files[i+d],files[i]];[urls[i],urls[i+d]]=[urls[i+d],urls[i]];[images[i],images[i+d]]=[images[i+d],images[i]];photoCache.clear();buildSlots();refresh()};btns.append(b)}line.append(label,btns);const pick=document.createElement('label');pick.className='slot-pick';const thumb=document.createElement('canvas');thumb.width=180;thumb.height=95;const tc=thumb.getContext('2d');tc.fillStyle='#e0eaf4';tc.fillRect(0,0,180,95);if(images[i])imageBox(tc,images[i],0,0,180,95,'contain');else{tc.fillStyle='#637f9f';tc.textAlign='center';tc.font='13px serif';tc.fillText('＋ 添加截图',90,49)}const span=document.createElement('span');span.textContent=files[i]?files[i].name.slice(0,16):'选择图片';const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;const old=urls[i];try{const url=URL.createObjectURL(file),im=new Image();im.decoding='async';im.src=url;await im.decode();files[i]=file;urls[i]=url;images[i]=im;photoCache.clear();if(old)URL.revokeObjectURL(old);buildSlots();refresh()}catch(err){say('图片读取失败：'+err.message)}};pick.append(thumb,span,input);wrap.append(line,pick);box.append(wrap)}}
const sleep=()=>new Promise(r=>setTimeout(r,0));
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function nameFile(ext){return (state.title||'湖光').replace(/[\\/:*?"<>|]/g,'').slice(0,26)+'-湖中倒影.'+ext}
async function exportPNG(){if(busy)return;busy=true;parent.postMessage({type:'studio-busy',busy:true},location.origin);$('savePng').disabled=$('saveGif').disabled=true;try{await document.fonts.ready;const w=+$('pngWidth').value,h=Math.round(w*1.4),out=document.createElement('canvas');out.width=w;out.height=h;const g=out.getContext('2d',{alpha:false});draw(g,w,h,paused?0:(performance.now()-epoch)/1000);const blob=await new Promise((res,rej)=>out.toBlob(b=>b?res(b):rej(Error('浏览器无法生成图片')),'image/png'));saveBlob(blob,nameFile('png'));say('PNG 已生成 · '+(blob.size/1024).toFixed(0)+' KB');out.width=out.height=1}catch(e){say('导出失败：'+e.message)}finally{busy=false;$('savePng').disabled=$('saveGif').disabled=false;parent.postMessage({type:'studio-busy',busy:false},location.origin)}}
async function exportGIF(){if(busy)return;if(typeof StudioGIFCodec!=='function'){say('GIF 编码器没有加载成功，请刷新网页重试');return;}busy=true;parent.postMessage({type:'studio-busy',busy:true},location.origin);$('savePng').disabled=$('saveGif').disabled=true;$('progress').hidden=false;$('progress').value=0;const wasPaused=paused;try{await document.fonts.ready;const w=+$('gifWidth').value,h=Math.round(w*1.4),fps=+$('gifFps').value,sec=+$('gifSecs').value,total=fps*sec,out=document.createElement('canvas');out.width=w;out.height=h;const g=out.getContext('2d',{alpha:false,willReadFrequently:true});const enc=StudioGIFCodec();const delay=Math.round(1000/fps);const start=0;for(let i=0;i<total;i++){draw(g,w,h,start+i/fps);const pixels=g.getImageData(0,0,w,h).data;if(i===0)enc.init(w,h,pixels,true);enc.frame(pixels,delay);$('progress').value=Math.round((i+1)/total*100);say('正在制作 GIF · '+(i+1)+' / '+total+' 帧');await sleep();}const bytes=enc.finish(),blob=new Blob([bytes],{type:'image/gif'});saveBlob(blob,nameFile('gif'));say('GIF 已生成 · '+(blob.size/1024/1024).toFixed(2)+' MB · '+total+' 帧');out.width=out.height=1}catch(e){console.error(e);say('GIF 生成失败：'+e.message+'（可改选 400px、6FPS）')}finally{busy=false;$('savePng').disabled=$('saveGif').disabled=false;$('progress').hidden=true;paused=wasPaused;parent.postMessage({type:'studio-busy',busy:false},location.origin)}}
$('savePng').onclick=exportPNG;$('saveGif').onclick=exportGIF;
$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'播放动效':'暂停动效';refresh()};

$('zoom').onclick=()=>{refresh();$('zoomImage').src=canvas.toDataURL('image/png');$('modal').hidden=false};
$('poster').onclick=$('zoom').onclick;$('closeZoom').onclick=()=>{$('modal').hidden=true};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').hidden=true};
$('font').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const ff=new FontFace('LakeUserFont',await f.arrayBuffer());await ff.load();document.fonts.add(ff);fontFamily='"LakeUserFont",Georgia,serif';refresh();say('字体已应用')}catch(err){say('字体无法加载：'+err.message)}};
function floating(){const flo=$('floating'),preview=$('poster');const r=preview.getBoundingClientRect(),should=!document.hidden&&(manualFloat||(r.bottom<90&&window.innerWidth<781));flo.hidden=!should;if(should&&performance.now()-floatLast>200)refresh()}
addEventListener('scroll',floating,{passive:true});addEventListener('resize',floating);
$('floatHide').onclick=()=>{$('floating').classList.toggle('collapsed');$('floatHide').textContent=$('floating').classList.contains('collapsed')?'＋':'−'};
const head=$('floatHead'),flo=$('floating');let drag=null;head.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;const r=flo.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top};head.setPointerCapture(e.pointerId)};head.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;flo.style.right='auto';flo.style.bottom='auto';flo.style.left=clamp(e.clientX-drag.x,4,window.innerWidth-flo.offsetWidth-4)+'px';flo.style.top=clamp(e.clientY-drag.y,4,window.innerHeight-flo.offsetHeight-4)+'px'};for(const ev of ['pointerup','pointercancel','lostpointercapture'])head.addEventListener(ev,()=>drag=null);
window.addEventListener('message',e=>{if(e.data?.type==='studio-active'){paused=!e.data.active;refresh()}});
const lakeTabNames=['screens','text','style','motion','export'];
function openLakeTab(name,scroll){
 if(!lakeTabNames.includes(name))return;
 for(const button of document.querySelectorAll('#lake-tabs [data-lake-tab]')){
   const selected=button.dataset.lakeTab===name;
   button.setAttribute('aria-selected',String(selected));
   button.tabIndex=selected?0:-1;
 }
 for(const panel of document.querySelectorAll('.edit [role="tabpanel"]'))panel.hidden=panel.id!=='lake-panel-'+name;
 if(scroll)requestAnimationFrame(()=>document.getElementById('lake-tabs').scrollIntoView({block:'start',behavior:'smooth'}));
}
for(const tab of document.querySelectorAll('#lake-tabs [data-lake-tab]')){
 tab.addEventListener('click',()=>openLakeTab(tab.dataset.lakeTab,true));
 tab.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  e.preventDefault();
  const n=lakeTabNames.indexOf(tab.dataset.lakeTab);
  const next=lakeTabNames[(n+(e.key==='ArrowRight'?1:-1)+lakeTabNames.length)%lakeTabNames.length];
  const el=document.getElementById('lake-tab-'+next);
  el.focus();openLakeTab(next,false);
 });
}
openLakeTab('screens',false);
$('openExport').onclick=()=>openLakeTab('export',true);
let manualFloat=false;
$('floatOpen').onclick=()=>{manualFloat=!manualFloat;$('floatOpen').textContent=manualFloat?'关闭悬浮':'悬浮预览';floating()};
bind();syncUI();refresh();raf=requestAnimationFrame(tick);try{parent.postMessage({type:'studio-ready'},location.origin)}catch(e){}
})();
