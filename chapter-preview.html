 cx=\"143.66\" cy=\"48.70\" rx=\"1.05\" ry=\"0.71\" fill=\"#D3BCE2\" opacity=\"0.08\" transform=\"rotate(23.811840413933623 143.66423565218423 48.69994559621004)\"/><ellipse cx=\"642.21\" cy=\"104.21\" rx=\"0.43\" ry=\"1.20\" fill=\"#FFFFFF\" opacity=\"0.08\" transform=\"rotate(-22.571062449436738 642.2126582929627 104.20867756391176)\"/><ellipse cx=\"353.61\" cy=\"63.32\" rx=\"0.72\" ry=\"2.47\" fill=\"#6BACE8\" opacity=\"0.08\" transform=\"rotate(-4.82180000871552 353.6132881245712 63.32198219350987)\"/><ellipse cx=\"580.52\" cy=\"53.76\" rx=\"0.41\" ry=\"0.96\" fill=\"#D3BCE2\" opacity=\"0.08\" transform=\"rotate(21.273874707889917 580.5246135532916 53.75875897753532)\"/>\n<\/svg>"}]</script><script>
const $=id=>document.getElementById(id);
const works=JSON.parse($('data').textContent);
let source='',timer=0;
function stop(){clearInterval(timer);timer=0;$('play').textContent='播放'}
let bookOnly=false;
function renderSVG(p,b=bookOnly?p:Number($('book').value)){
 const xml=source.replace(/\{=\s*([^{}]+)\}/g,(_,expression)=>{
  const tokens=expression.match(/min|max|bookPct|totalPct|chapterPct|\d*\.?\d+|[-+*/()]|\S/g)||[];
  let i=0;
  function atom(){
   const t=tokens[i++];
   if(t==='-')return -atom();
   if(t==='+')return atom();
   if(t==='('){const n=sum();if(tokens[i++]!==')')throw Error('表达式括号未闭合');return n}
   if(t==='chapterPct')return p;
   if(t==='bookPct'||t==='totalPct')return b;
   if(t==='min'||t==='max'){
    if(tokens[i++]!=='(')throw Error('函数缺少左括号');
    const args=[sum()];
    while(tokens[i]===','){i++;args.push(sum())}
    if(tokens[i++]!==')')throw Error('函数缺少右括号');
    return Math[t](...args)
   }
   if(t && /^\d*\.?\d+$/.test(t))return Number(t);
   throw Error('暂不支持此表达式：'+expression);
  }
  function product(){let n=atom();while(['*','/'].includes(tokens[i])){const op=tokens[i++],v=atom();n=op==='*'?n*v:n/v}return n}
  function sum(){let n=product();while(['+','-'].includes(tokens[i])){const op=tokens[i++],v=product();n=op==='+'?n+v:n-v}return n}
  const n=sum();if(i!==tokens.length||!Number.isFinite(n))throw Error('无法计算：'+expression);return String(+n.toFixed(5))
 });
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)
}
function paint(){const p=Number($('pct').value);$('value').textContent=p+'%';try{const url=renderSVG(p);$('art').src=url;if($('zoom').open)$('large').src=url}catch(e){stop();$('status').textContent=e.message;$('art').removeAttribute('src');$('large').removeAttribute('src')}}
function stages(){const box=$('steps');box.replaceChildren();if(!$('stages').open||!source)return;for(const p of [0,25,50,75,100]){const row=document.createElement('div'),img=new Image();row.append(p+'%',img);img.className='art';try{img.src=renderSVG(p)}catch(e){row.append(e.message)}box.append(row)}}
function apply(src){
 stop();source='';$('art').removeAttribute('src');$('large').removeAttribute('src');$('steps').replaceChildren();$('play').disabled=true;
 try{const doc=new DOMParser().parseFromString(src,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg'||doc.documentElement.namespaceURI!=='http://www.w3.org/2000/svg')throw Error('请检查 SVG 的 XML 格式和 xmlns 命名空间。');
 const macros=(src.match(/\{=[^{}]*\}/g)||[]).join(' ');
 const chapter=/\bchapterPct\b/.test(macros),book=/\b(?:bookPct|totalPct)\b/.test(macros);
 bookOnly=book&&!chapter;
 document.querySelector('label[for="pct"]').textContent=bookOnly?'全书进度':'本章进度';
 $('bookControls').hidden=!(chapter&&book);
 source=src;renderSVG(Number($('pct').value));$('status').textContent=chapter&&book?'已识别章节和全文进度。':book?'已识别全文进度。':chapter?'已识别本章进度。':'当前显示静态图。';$('play').disabled=false;paint();stages()
 }catch(e){source='';$('status').textContent=e.message}
}
for(const [i,w] of works.entries())$('examples').add(new Option(w.name,i));
function sample(){$('filename').textContent='';const w=works[$('examples').value];$('code').value=w.template;apply(w.template)}
$('examples').onchange=sample;$('apply').onclick=()=>{ $('examples').selectedIndex=-1;apply($('code').value)};
$('book').oninput=()=>{stop();$('bookValue').textContent=$('book').value+'%';paint();stages()};
$('paste').onclick=async()=>{
 let src;
 try{src=await navigator.clipboard.readText()}catch{$('code').focus();$('status').textContent='请在代码框长按粘贴，粘贴后会自动识别。';return}
 if(!src.trim()){$('status').textContent='剪贴板里没有文本。';return}
 $('code').value=src;$('filename').textContent='';$('apply').click()
};
$('code').onpaste=()=>setTimeout(()=>$('apply').click(),0);
$('choose').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(f){$('filename').textContent=f.name;$('code').value=await f.text();$('apply').click();e.target.value=''}};
$('pos').onchange=()=>$('art').classList.toggle('foot',$('pos').selectedIndex===1);
$('mode').onchange=()=>{const night=$('mode').selectedIndex===1;$('paper').classList.toggle('night',night);for(const id of ['steps','large'])$(id).classList.toggle('night-art',night)};
$('zoom').ontoggle=()=>{if(source)paint()};$('stages').ontoggle=stages;
$('pct').oninput=()=>{stop();if(source)paint();else $('value').textContent=$('pct').value+'%'};
$('play').onclick=()=>{if(timer)return stop();if(+$('pct').value===100)$('pct').value=0;$('play').textContent='暂停';timer=setInterval(()=>{$('pct').value=+$('pct').value+1;paint();if(+$('pct').value===100)stop()},100)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});sample();
</script></html>
