// Fit each frame's 256-color table to its actual screenshot colors.
function gifColors(pixels){
  const histogram=new Map();
  const keyOf=(r,g,b)=>((r>>2)<<12)|((g>>2)<<6)|(b>>2);
  for(let i=0;i<pixels.length;i+=4){
    const r=pixels[i],g=pixels[i+1],b=pixels[i+2],key=keyOf(r,g,b);
    const bin=histogram.get(key);
    if(bin){bin[0]+=r;bin[1]+=g;bin[2]+=b;bin[3]++;}
    else histogram.set(key,[r,g,b,1]);
  }
  const colors=Array.from(histogram.values(),bin=>[bin[0]/bin[3],bin[1]/bin[3],bin[2]/bin[3],bin[3]]);
  function box(colors){
    let count=0;
    const sum=[0,0,0],square=[0,0,0];
    for(const c of colors){
      count+=c[3];
      for(let k=0;k<3;k++){sum[k]+=c[k]*c[3];square[k]+=c[k]*c[k]*c[3];}
    }
    const variance=square.map((v,i)=>v-sum[i]*sum[i]/count);
    let axis=0;
    if(variance[1]>variance[axis])axis=1;
    if(variance[2]>variance[axis])axis=2;
    return {colors,count,axis,score:colors.length>1?variance[axis]:-1,mean:sum.map(v=>Math.round(v/count))};
  }
  const boxes=[box(colors)];
  while(boxes.length<256){
    let index=0;
    for(let i=1;i<boxes.length;i++)if(boxes[i].score>boxes[index].score)index=i;
    const {colors,axis,count,score}=boxes[index];
    if(score<0)break;
    colors.sort((a,b)=>a[axis]-b[axis]);
    let mid=1,weight=colors[0][3];
    while(mid<colors.length-1&&weight<count*.5)weight+=colors[mid++][3];
    boxes[index]=box(colors.slice(0,mid));boxes.push(box(colors.slice(mid)));
  }
  const palette=boxes.map(b=>b.mean);
  // Cache nearest colors per occupied bin to keep large frames responsive.
  const lookup=new Uint8Array(1<<18);
  for(const [key,[r,g,b,count]] of histogram){
    let nearest=0,best=Infinity;
    const R=r/count,G=g/count,B=b/count;
    for(let i=0;i<palette.length;i++){
      const c=palette[i],d=2*(R-c[0])**2+3*(G-c[1])**2+(B-c[2])**2;
      if(d<best){best=d;nearest=i;}
    }
    lookup[key]=nearest;
  }
  return {palette,lookup,keyOf};
}
function makeGif(width,height){
  const bytes=[],parts=[];
  const word=n=>bytes.push(n&255,n>>8);
  const ascii=str=>{for(const c of str)bytes.push(c.charCodeAt(0));};
  const flush=()=>{parts.push(Uint8Array.from(bytes));bytes.length=0;};
  ascii('GIF89a');word(width);word(height);bytes.push(0x70,0,0);
  bytes.push(0x21,0xff,11);ascii('NETSCAPE2.0');bytes.push(3,1,0,0,0);
  flush();
  function frame(pixels,delay){
    const {palette,lookup,keyOf}=gifColors(pixels);
    const compressed=[],table=new Map();
    let widthBits=9,next=258,buffer=0,bits=0,prefix=-1;
    const emit=code=>{
      buffer|=code<<bits;bits+=widthBits;
      while(bits>=8){compressed.push(buffer&255);buffer>>>=8;bits-=8;}
    };
    emit(256);
    for(let i=0;i<pixels.length;i+=4){
      const color=lookup[keyOf(pixels[i],pixels[i+1],pixels[i+2])];
      if(prefix<0){prefix=color;continue;}
      const key=prefix*256+color,existing=table.get(key);
      if(existing!==undefined){prefix=existing;continue;}
      emit(prefix);
      if(next===4096){emit(256);table.clear();next=258;widthBits=9;}
      else{table.set(key,next++);if(next>(1<<widthBits))widthBits++;}
      prefix=color;
    }
    emit(prefix);
    if(next===(1<<widthBits)&&widthBits<12)widthBits++;
    emit(257);
    if(bits)compressed.push(buffer&255);
    bytes.push(0x21,0xf9,4,4);word(delay);bytes.push(0,0,0x2c);word(0);word(0);word(width);word(height);bytes.push(0x87);
    for(let i=0;i<256;i++)bytes.push(...(palette[i]||[0,0,0]));
    bytes.push(8);
    flush();
    for(let i=0;i<compressed.length;i+=255){
      const count=Math.min(255,compressed.length-i),block=new Uint8Array(count+1);
      block[0]=count;block.set(compressed.slice(i,i+count),1);parts.push(block);
    }
    parts.push(Uint8Array.of(0));
  }
  return {frame,finish:()=>new Blob([...parts,Uint8Array.of(0x3b)],{type:'image/gif'})};
}
$('gif').onclick=async()=>{

};

$('record').onclick=async()=>{if(recording||gifJob)return;if(!window.MediaRecorder||!C.captureStream){$('recordStatus').textContent='此浏览器不能录制视频。可保存 PNG 或 GIF，或用 Chrome 再试。';return}
