panel.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.select){S.selected=d.select;render();paintPanel();return}if(d.palette){update(()=>{S.colors={...palettes[d.palette]};S.palette=d.palette});return}if(d.count){update(()=>setFrameCount(+d.count));return}if(d.add){addLayer(d.add);return}if(d.upload){setImageTarget(d.upload);return}if(d.clearImage){update(()=>layer(d.clearImage).image=null);return}if(d.toggle){update(()=>{const l=layer(d.toggle);l.visible=!l.visible});return}if(d.front){update(()=>{const i=S.layers.findIndex(l=>l.id===d.front);S.layers.push(S.layers.splice(i,1)[0])});return}if(d.remove){update(()=>{S.layers=S.layers.filter(l=>l.id!==d.remove);S.selected=S.layers.at(-1)?.id||null});return}if(d.export){exportPng(d.export==='png2'?2:1);return}if(d.gif){exportGif();return}switch(el.id){case 'bgUpload':document.getElementById('bgInput').click();break;case 'bgClear':update(()=>S.background=null);break;case 'feltReset':update(()=>S.colors.felt=palettes[S.palette]?.felt||palettes.forest.felt);break;case 'saveProject':downloadBlob(new Blob([JSON.stringify({...S,selected:null},null,2)],{type:'application/json'}),'绣样帖_工程.json');toast('工程已保存');break;case 'loadProject':document.getElementById('projectInput').click();break;case 'fontUpload':document.getElementById('fontInput').click();break;case 'delFont':deleteCustomFont();break}});
document.getElementById('quickExport').addEventListener('click',()=>exportPng(2));
document.getElementById('undo').addEventListener('click',()=>{if(!hist.length)return;future.push(snapshot());restore(hist.pop())});
document.getElementById('redo').addEventListener('click',()=>{if(!future.length)return;hist.push(snapshot());restore(future.pop())});
function point(e){const p=scene.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=scene.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
scene.addEventListener('pointerdown',e=>{let el=e.target.closest('[data-id]');if(!el)return;let id=el.dataset.id,l=layer(id);if(!l)return;document.querySelector('.stage-tip')?.classList.add('hide');const p=point(e),handle=e.target.closest('[data-handle]')?.dataset.handle||'move';S.selected=id;drag={id,handle,start:p,x:l.x,y:l.y,scale:l.scale,rotation:l.rotation,snapshot:snapshot()};moving=false;try{scene.setPointerCapture(e.pointerId)}catch{}render();paintPanel();e.preventDefault()});
scene.addEventListener('pointermove',e=>{if(!drag)return;const l=layer(drag.id);if(!l)return;let p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>2)moving=true;if(drag.handle==='move'){l.x=clamp(drag.x+dx,-80,1280);l.y=clamp(drag.y+dy,-80,840)}else if(drag.handle==='scale'){const d0=Math.hypot(drag.start.x-drag.x,drag.start.y-drag.y)||1,d1=Math.hypot(p.x-drag.x,p.y-drag.y);l.scale=clamp(drag.scale*d1/d0,.25,3.5)}else if(drag.handle==='rotate'){const a0=Math.atan2(drag.start.y-drag.y,drag.start.x-drag.x),a1=Math.atan2(p.y-drag.y,p.x-drag.x);l.rotation=rnd(drag.rotation+(a1-a0)*180/Math.PI)}const g=Array.from(scene.querySelectorAll('g.scene-layer')).find(node=>node.dataset.id===l.id);if(g)g.setAttribute('transform',`translate(${rnd(l.x)} ${rnd(l.y)}) rotate(${rnd(l.rotation)}) scale(${rnd(l.scale)})`);e.preventDefault()});
function stopDrag(e){if(!drag)return;const b=drag.snapshot;drag=null;if(moving){commit(b);paintPanel()}render();moving=false;try{scene.releasePointerCapture(e.pointerId)}catch{}}
scene.addEventListener('pointerup',stopDrag);scene.addEventListener('pointercancel',stopDrag);
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.getElementById(e.shiftKey?'redo':'undo').click()}if((e.key==='Delete'||e.key==='Backspace')&&layer(S.selected)){e.preventDefault();update(()=>{S.layers=S.layers.filter(l=>l.id!==S.selected);S.selected=S.layers[0]?.id||null})}});
render();paintPanel();updateUndo();setTimeout(()=>document.querySelector('.stage-tip')?.classList.add('hide'),9000);
})();

</script>
<script>
(()=>{'use strict';
const KEY='gu-recent-colors-v1';let colors=[];try{colors=JSON.parse(localStorage.getItem(KEY)||'[]').filter(c=>/^#[0-9a-f]{6}$/i.test(c)).slice(0,12)}catch{}
const tracked=new Map();
function paintRow(input,row){row.replaceChildren();if(!colors.length)return;const label=document.createElement('small');label.textContent='最近使用';label.style.cssText='font-size:10px;color:#8d978d;display:block;margin:1px 0 4px';row.append(label);const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:6px;flex-wrap:wrap';for(const color of colors){const b=document.createElement('button');b.type='button';b.title=color;b.setAttribute('aria-label','使用颜色 '+color);b.style.cssText='width:24px;height:24px;min-height:24px;padding:0;border:1px solid #0002;border-radius:50%;background:'+color;wrap.append(b)}row.append(wrap)}
function attach(input){if(tracked.has(input))return;const host=input.closest('label')||input.closest('.row,.field')||input.parentElement;const row=document.createElement('div');row.style.cssText='margin:2px 0 12px';if(host.parentElement&&getComputedStyle(host.parentElement).display==='grid')row.style.gridColumn='1 / -1';host.after(row);tracked.set(input,row);paintRow(input,row);
let timer;const remember=()=>{const c=(input.value||'').toLowerCase();if(!/^#[0-9a-f]{6}$/.test(c))return;colors=[c,...colors.filter(v=>v!==c)].slice(0,12);try{localStorage.setItem(KEY,JSON.stringify(colors))}catch{}for(const [inp,r] of tracked)if(inp.isConnected)paintRow(inp,r)};
row.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;input.value=b.title;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));window.StudioColors?.refresh();remember()});
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(remember,650)});
input.addEventListener('change',()=>{clearTimeout(timer);remember()})}
function scan(){for(const input of document.querySelectorAll('#panel input[type=color]'))attach(input)}
scan();new MutationObserver(scan).observe(document.getElementById('panel'),{childList:true,subtree:true});
})();

(function(){
'use strict';
const cfg={"id":"relics","source":"relics.html","name":"绣样帖","count":1,"upload":"imageInput","svg":"scene","filename":"11-绣样帖-原绘制版.html","ctrl":[],"labels":{},"screens":[{"id":"s1","label":"首页","page":"home"}]},root=document.getElementById('gu-reeden-output'),img=document.getElementById('gu-reeden-img');
const qs=x=>x.startsWith('#')?document.querySelector(x):document.getElementById(x);
let generation=0;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const put=(id,value)=>{const e=document.getElementById(id);if(!e||!('value'in e)||value==null)return;if(e.type==='checkbox')e.checked=!!value;else e.value=String(value);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
function redraw(){
 let e=document.getElementById(cfg.canvas||'__no_canvas__');
 try{
  if(cfg.svg){e=document.getElementById(cfg.svg);if(e){const clone=e.cloneNode(true);clone.removeAttribute('id');clone.setAttribute('xmlns','http://www.w3.org/2000/svg');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));return}}
  if(e&&e.width&&e.height){const pic=e.toDataURL('image/png');if(img.src!==pic)img.src=pic}
 }catch(err){root.dataset.captureError=String(err)}
}
async function fileFrom(src,index){
 if(typeof src!=='string'||!src)return null;let b=null;
 try{const r=await fetch(src);if(r.ok)b=await r.blob()}catch(_){}
 if(!b){
  b=await new Promise(resolve=>{const im=new Image();im.onload=()=>{try{
   const c=document.createElement('canvas'),f=Math.min(1,1600/Math.max(im.width,im.height));
   c.width=Math.max(1,Math.round(im.width*f));c.height=Math.max(1,Math.round(im.height*f));
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   c.toBlob(resolve,'image/png');c.width=c.height=1;
  }catch(_){resolve(null)}};im.onerror=()=>resolve(null);im.src=src});
 }
 return b?new File([b],'reeden-'+(index+1)+'.png',{type:b.type||'image/png'}):null;
}
function send(selector,list){
 const target=qs(selector);if(!target||!list.length)return false;
 try{const d=new DataTransfer();list.forEach(file=>d.items.add(file));target.files=d.files;target.dispatchEvent(new Event('change',{bubbles:true}));return true}
 catch(err){root.dataset.uploadError=selector+':'+String(err);return false}
}
function applyParams(payload){
 const p=payload.params||{},th=payload.theme||{};
 const title=p.themeTitle||th.name||'',author=p.themeAuthor||th.author||'',description=p.themeDescription||th.description||'';
 const map={title,themeName:title,maker:author,author,'cover-title':title,'cover-author':author,titleText:title,'bag-name':title,message:description};
 for(const [id,value] of Object.entries(map))if(value)put(id,value);
 for(const id of cfg.ctrl||[]){const key=id.replace(/[-_]+([a-z])/g,(_,c)=>c.toUpperCase());if(Object.hasOwn(p,key))put(id,p[key])}
}
window.ReedenShareTemplate={render(payload){
 payload=payload||window.ReedenShareTemplateMock||{};
 const version=++generation;
 redraw();
 (async()=>{
  await delay(120);if(version!==generation)return;
  applyParams(payload);
  const s=Array.isArray(payload.screens)?payload.screens.slice(0,cfg.count):[];
  const files=(await Promise.all(s.map((a,i)=>fileFrom(a&&a.image,i)))).filter(Boolean);
  if(version!==generation)return;
  if(cfg.id==='huajian'){send('#groups input[type=file]',files.slice(0,2))}
  else if(cfg.id==='yan'){send('setA',files.slice(0,3));if(files.length>3){await delay(450);send('setB',files.slice(3,6))}}
  else if(cfg.id==='relics'){send('imageInput',files.slice(0,1))}
  else send(cfg.upload,files);
  let tries=16;
  const tick=()=>{if(version!==generation)return;redraw();if(--tries>0)setTimeout(tick,250)};
  setTimeout(tick,400);
 })().catch(err=>{root.dataset.renderError=String(err)});
}};
const mock={type:'themePreview',theme:{name:cfg.name,author:'gu',description:'原版 gu 艺术模板'},screens:cfg.screens.map(s=>({...s,image:null,width:720,height:1600}))};
window.ReedenShareTemplateMock=mock;
window.ReedenShareTemplate.render(window.__REEDEN_SHARE_PAYLOAD__||mock);
})();
