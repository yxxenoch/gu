host">纯净</button></div></div></section><aside class="editor"><div class="editor-head"><h2>你的返图，你来定义。</h2><p>上传截图 → 调整花笺 → 保存喜欢的模样</p></div><nav class="tabs" role="tablist"><button class="tab active" data-panel="template" role="tab" aria-selected="true">模板</button><button class="tab " data-panel="photo" role="tab" aria-selected="false">图片</button><button class="tab " data-panel="text" role="tab" aria-selected="false">文字</button><button class="tab " data-panel="background" role="tab" aria-selected="false">背景</button><button class="tab " data-panel="export" role="tab" aria-selected="false">导出</button></nav><section class="panel active" id="panel-template" role="tabpanel"><div class="section"><div class="section-heading"><h3>选择一份氛围</h3></div><div class="grid2" id="folio-presets"></div></div><div class="section"><div class="section-heading"><h3>画面与翻页</h3></div><label class="field"><span>底纸展示方式</span><select id="layout"><option value="pair">双页纸底</option><option value="day">浅色纸底</option><option value="night">深色纸底</option></select></label><label class="field"><span>截图占比</span><input id="scale" type="range" min="70" max="100" value="94"></label><label class="field"><span>每页停留（秒）</span><input id="hold" type="range" min="1" max="5" value="2"></label><label class="field"><span>卷页时间（秒）</span><input id="duration" type="range" min="1" max="3" step="0.25" value="1.5"></label></div></section><section class="panel " id="panel-photo" role="tabpanel"><div class="section"><div class="section-heading"><h3>页面分组 · 每组 1–2 张</h3></div><div id="groups"></div><button id="add" class="button">＋ 添加一组</button><p class="hint">拖动截图可调整位置。三组翻两次，播放结束后停在末页。</p></div></section><section class="panel " id="panel-text" role="tabpanel"><div class="section"><div class="section-heading"><h3>主题信息</h3></div><label class="field"><span>主题名</span><input id="title" type="text" value="花笺藏册" maxlength="24"></label><label class="field"><span>制作者</span><input id="author" type="text" value="" maxlength="40"></label><labe
