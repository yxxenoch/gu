g><div class="caption" id="caption" hidden><div class="caption-heading"><h2 id="theme-title"></h2><p id="theme-author"></p></div><p id="theme-description"></p></div></main></div></div><p class="gu-meta">画面随简介延长，工具图标与截图保持原比例。</p></section><section class="gu-panel"><nav id="gu-tabs" class="gu-tabs" aria-label="编辑分区"></nav><div class="gu-box"><h2>截图 · SCREENSHOTS</h2><button id="gu-batch" type="button">一次上传 1–3 张截图</button><input id="gu-batch-file" type="file" accept="image/*" multiple hidden><div class="gu-file-grid" id="gu-files"></div><p class="gu-meta">按首页、阅读、书架的顺序上传，也可以单独替换。</p></div><div class="gu-box"><h2>主题信息</h2><label>主题名称<input class="gu-input" type="text" id="gu-title" maxlength="120" value="千禧桌面"></label><label>制作者<input class="gu-input" type="text" id="gu-author" maxlength="80" placeholder="作者名称"></label><label>简介<textarea class="gu-input" id="gu-description" maxlength="1500">一张截图，就是今天保存在桌面上的颜色。</textarea></label><div class="gu-row"><span>主题文字字体</span><select id="gu-font"><option value="system-ui">系统默认</option><option value="serif">衬线字体</option><option value="sans-serif">无衬线字体</option><option value="monospace">等宽字体</option></select></div><div class="gu-actions"><button type="button" id="gu-font-pick">上传字体</button><input type="file" id="gu-font-file" accept=".ttf,.otf,.woff,.woff2" hidden><span id="gu-font-status" class="gu-meta"></span></div><p class="gu-meta">菜单栏和状态栏使用固定矢量字形，不随主题字体改变。</p></div><div id="gu-settings"></div><div class="gu-box" id="gu-export-box"><h2>导出设置</h2><label class="gu-row"><span>输出宽度</span><select id="gu-resolution"><option value="900">900 px</option><option value="1350">1350 px</option><option value="1800" selected>1800 px</option><option value="2700">2700 px</option></select></label><label class="gu-row"><span>GIF 宽度</span><select id="gu-gif-size"><option value="600">600 px · 小体积</option><option value="900" selected>900 px · 推荐</option><option value="1200">1200 px · 高清</option></select></label><label class="gu-row"><span>GIF 帧率</span><select id="gu-gif-fps"><option value="8">8 fps</option><option value="10" selected>10 fps</option><option value="15">15 fps</option></select></label><progress id="gu-progress" max="100" value="0" hidden></progress><div class="gu-actions"><button type="button" class="gu-primary" id="gu-export">静图 PNG</button><button type="button" class="gu-primary" id="gu-gif-export">动态 GIF</button><button type="button" id="gu-cancel" hidden>取消生成</button><button type="button" id="gu-reset">恢复默认参数</button></div><p id="gu-status" role="status" class="gu-meta">上传截图后即可生成图片。</p><div id="gu-results" class="gu-results"></div></div></section></div><script>const CONFIG={accent:'#e4aec9',shell:'#dbb6c8',count:3};
(()=>{
'use strict';
const poster=document.getElementById('poster'),row=document.getElementById('screen-row');
const slots=JSON.parse(document.querySelector('meta[name="reeden-template-screens"]').content);
const get=(o,n,d)=>o?.[n]??o?.['param.'+n]??o?.param?.[n]??d;
const flag=(o,n,d)=>[true,'true','1',1].includes(get(o,n,d));
const number=(o,n,d,min,max)=>{const z=Number(get(o,n,d));return Math.min(max,Math.max(min,Number.isFinite(z)?z:d))};
const clean=v=>v==null?'':String(v).trim();
// Reeden/Flutter sends #AARRGGBB; CSS expects RGBA, not ARGB.
const hex=(val,def)=>{
 const raw=clean(val);
 const argb=/^#([a-f\d]{2})([a-f\d]{6})$/i.exec(raw);
 if(argb){const a=parseInt(argb[1],16),rgb=argb[2];return a===255?'#'+rgb:'rgba('+[0,2,4].map(i=>parseInt(rgb.slice(i,i+2),16)).join(',')+','+(a/255).toFixed(6)+')';}
 if(/^#[a-f\d]{6}$/i.test(raw))return raw;
 if(/^#[a-f\d]{3}$/i.test(raw))return raw;
 return def;
};
const mock={type:'themePreview',theme:{name:'千禧桌面',author:'',description:'一张截图，就是今天保存在桌面上的颜色。'} ,screens:slots.map(s=>({...s,image:null}))};
window.ReedenShareTemplateMock=mock;
function placeholder(i){
 const d=document.createElement('div');d.className='placeholder';
 const palettes=[['#e0e4df','#acbdb4'],['#efe8e2','#b7b3aa'],['#e4e0e8','#aaa6ba']];
 d.style.background=`linear-gradient(150deg,${palettes[i][0]},#f8f6ed)`;
 d.innerHTML='<div class="top">9:41　• • •</div><div class="brand">REEDEN</div><div class="art">✦</div><div class="mini">A LITTLE LIBRARY</div><div class="lines"></div><div class="bottom">⌂　　 ♡　　 ☾</div>';
 return d;
}
function makeShot(screen,i,isDemo){const d=document.createElement('div');d.className='shot';const src=clean(screen?.image);
 if(src){const bg=document.createElement('img');bg.className='shot-bg';bg.src=src;bg.alt='';d.append(bg);
 const img=document.createElement('img');img.alt=clean(screen.label)||'Reeden '+(i+1);img.src=src;img.decoding='async';img.loading='eager';img.onerror=()=>{d.textContent='截图加载失败'};d.append(img)
 }else if(isDemo){d.append(placeholder(i))}else{d.append(placeholder(i))}return d;}
const descNode=document.getElementById('theme-description');
const art=document.getElementById('paint-art'),over=document.getElementById('paint-over');
const bottom=document.getElementById('paint-bottom');
let lastExtra=-1,lastWidth=-1,lastHostWidth=-1,lastCompact=null;
function layoutDescription(forceNotify=false){
 const w=poster.clientWidth;
 if(!w)return;
 const visible=!descNode.hidden&&!document.getElementById('caption').hidden;
 const auto=poster.dataset.autoDescription!=='false';
 // Base description runs from y=729 to y=784, leaving ten units before the palette.
 const measured=visible&&auto?descNode.getBoundingClientRect().height*900/poster.getBoundingClientRect().width:0;
 const extra=visible&&auto?Math.max(0,Math.ceil(measured+1-55)):0;
 const compact=poster.dataset.compactCanvas!=='false';
 if(extra!==lastExtra||w!==lastWidth||compact!==lastCompact){
  const trim=compact?52:0; const full=1026+extra; const h=full-trim-(compact?56:0);
  poster.style.setProperty('--trim-top',`${trim/9}cqw`);
  poster.style.setProperty('--aspect',`900 / ${h}`);
  art.setAttribute('viewBox',`0 ${trim} 900 ${h}`);over.setAttribute('viewBox',`0 ${trim} 900 ${h}`);
  for(const id of ['paint-wall-base','paint-wall-tint'])document.getElementById(id).setAttribute('height',full);
  document.getElementById('paint-shadow').setAttribute('height',791+extra);
  document.getElementById('paint-window').setAttribute('height',786+extra);
  document.querySelectorAll('[data-flex-edge]').forEach(e=>e.setAttribute('height',786+extra));
  document.getElementById('window-lower-edges').setAttribute('transform',`translate(0 ${extra-24})`);
  bottom.setAttribute('transform',`translate(0 ${extra})`);
  forceNotify=true;lastExtra=extra;lastWidth=w;lastCompact=compact;
 }
 if(forceNotify&&typeof window.Reeden?.resize==='function')window.Reeden.resize();
}
if(typeof ResizeObserver!=='undefined'){
 const observer=new ResizeObserver(()=>{if(poster.clientWidth!==lastHostWidth){lastHostWidth=poster.clientWidth;layoutDescription();}});
 observer.observe(poster);
}else window.addEventListener('resize',()=>layoutDescription());
if(document.fonts){document.fonts.ready.then(()=>layoutDescription());if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>layoutDescription());}
window.ReedenShareTemplate={render(payload={}){
 const params=payload.params||{},appearance=payload.appearance||{},theme=payload.theme||{};
 const incoming=Array.isArray(payload.screens)?payload.screens:[];
 const count=Math.round(number(params,'screenCount',CONFIG.count,1,3));
 const primary=Math.round(number(params,'mainScreen',0,0,2));
 const indices=count===1?[primary]:Array.from({length:count},(_,i)=>i);
 const isDemo=payload===mock||(!incoming.some(s=>clean(s?.image))&&!window.__REEDEN_SHARE_PAYLOAD__);
 row.dataset.count=String(count);
 row.dataset.fit=get(params,'screenFit','contain')==='cover'?'cover':'contain';
 row.dataset.backdrop=get(params,'screenBackdrop','blur')==='solid'?'solid':'blur';
 const imageSignature=JSON.stringify([indices,incoming.map(s=>[s?.id,s?.page,s?.label,s?.image])]);if(row.dataset.imageSignature!==imageSignature){row.dataset.imageSignature=imageSignature;row.replaceChildren();
 for(const i of indices){const slot=slots[i];const item=incoming.find(s=>s?.id===slot.id)||incoming.find(s=>s?.page===slot.page)||incoming[i]||{};row.append(makeShot(item,i,isDemo));}}
 poster.style.setProperty('--accent',hex(get(params,'accentColor',CONFIG.accent),CONFIG.accent));
 poster.style.setProperty('--shell',hex(get(params,'shellColor',CONFIG.shell),CONFIG.shell));
 const heart=hex(get(params,'heartColor','#ef9dc8'),'#ef9dc8');
 poster.style.setProperty('--heart',heart);
 const rgb=heart.startsWith('#')?(heart.length===4?heart.slice(1).split('').map(c=>parseInt(c+c,16)):[1,3,5].map(i=>parseInt(heart.slice(i,i+2),16))):heart.match(/\d+(?:\.\d+)?/g).slice(0,3).map(Number);
 poster.style.setProperty('--folder-edge','rgb('+rgb.map(n=>Math.round(n*.72)).join(',')+')');
 poster.style.setProperty('--metal',hex(get(params,'metalColor','#c0c0c0'),'#c0c0c0'));
 poster.style.setProperty('--pearl',hex(get(params,'pearlColor','#a98bd3'),'#a98bd3'));

function syncSlots(){for(const [i,s] of images.entries()){const v=slotViews[i];v.img.hidden=!s.image;v.clear.hidden=!s.image;if(s.image)v.img.src=s.image;else v.img.removeAttribute('src');v.name.textContent=s.image?(fileNames.get(s.image)||'已上传'):'未上传'}}

const realRefresh=refresh;refresh=function(){realRefresh();attachFlash();syncMirror();recordSoon()};
function restore(s){const state=JSON.parse(s);restoring=true;try{for(const row of rows)row.el._sync?.(state.params[row.key]);Object.assign(params,state.params);for(const [i,id] of ['gu-title','gu-author','gu-description'].entries())$(id).value=state.text[i];$('gu-font').value=state.font;images.forEach((im,i)=>im.image=state.images[i]);syncSlots();Object.assign(motion,state.motion);syncMotion();for(const [i,id] of ['gu-resolution','gu-gif-size','gu-gif-fps'].entries())$(id).value=state.sizes[i];refresh();lastState=snapshot()}finally{restoring=false;historyUI();releaseOldImages()}}

$('gu-undo').onclick=()=>travel(true);$('gu-redo').onclick=()=>travel(false);document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey||e.target.closest?.('input,textarea,select,[contenteditable]'))return;const k=e.key.toLowerCase();if(k==='z'||k==='y'){e.preventDefault();travel(k==='z'&&!e.shiftKey)}});for(const id of ['gu-resolution','gu-gif-size','gu-gif-fps'])$(id).addEventListener('change',recordSoon);
const resetOld=$('gu-reset').onclick;$('gu-reset').onclick=()=>{if(busy)return;record();resetOld();Object.assign(motion,{enabled:true,strength:55,period:3.2});syncMotion();record()};
function setBusy(value){busy=value;post({type:'studio-busy',busy});for(const el of document.querySelectorAll('.gu-panel input,.gu-panel select,.gu-panel textarea,.gu-panel button,.gu-tools button,.gu-head button,.gu-float-head button')){if(el.id==='gu-cancel')continue;if(value){el.dataset.guWasDisabled=el.disabled?'1':'0';el.disabled=true}else if(el.dataset.guWasDisabled!==undefined){el.disabled=el.dataset.guWasDisabled==='1';delete el.dataset.guWasDisabled}}$('gu-cancel').hidden=!value;$('gu-cancel').disabled=false;$('gu-progress').hidden=!value;if(value){$('gu-progress').value=0;pauseFrame()}else{historyUI();if(playing)playPause(true)}}
function validScreens(){const count=Number(params.screenCount),indices=count===1?[Number(params.mainScreen)]:Array.from({length:count},(_,i)=>i);return indices.every(i=>!!images[i]?.image)}
function displayResult(blob,kind){if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(blob);const result=$('gu-results');result.replaceChildren();const img=new Image();img.src=resultUrl;img.alt='生成的'+kind+'返图';const a=document.createElement('a');a.textContent='保存 '+kind;a.href=resultUrl;a.download=($('gu-title').value||'千禧桌面').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+'.'+kind.toLowerCase();a.style.cssText='display:inline-block;background:#365b4e;color:white;padding:9px 16px;border-radius:8px;text-decoration:none';result.append(img,a);if(navigator.canShare&&navigator.share){const file=new File([blob],a.download,{type:blob.type});if(navigator.canShare({files:[file]})){const b=document.createElement('button');b.textContent='分享 / 保存到相册';b.style.marginLeft='8px';b.onclick=()=>navigator.share({files:[file]}).catch(()=>{});result.append(b)}}say('已生成 '+(blob.size/1048576).toFixed(2)+' MB '+kind+'，可保存或长按图片。');result.scrollIntoView({block:'nearest',behavior:'smooth'})}
function makeEngine(){const factory=window.StudioGIFCodec;if(typeof factory!=='function')throw Error('GIF 编码器尚未加载，请刷新网页。');let worker=null,pending=null,local=null,url=null;try{const code='const codec=('+factory.toString()+')();self.onmessage=e=>{try{const m=e.data;if(m.type==="init"){codec.initAdaptive(m.w,m.h,true);self.postMessage({ok:true})}else if(m.type==="frame"){codec.adaptiveFrame(new Uint8ClampedArray(m.data),m.delay);self.postMessage({ok:true})}else{const b=codec.finish();self.postMessage({buffer:b.buffer},[b.buffer])}}catch(err){self.postMessage({error:err.message})}}';url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));worker=new Worker(url);worker.onmessage=e=>{const p=pending;pending=null;if(p)e.data.error?p.reject(Error(e.data.error)):p.resolve(e.data)};worker.onerror=e=>{const p=pending;pending=null;if(p)p.reject(Error(e.message||'GIF 编码失败'))}}catch(e){local=factory()}finally{if(url)URL.revokeObjectURL(url)}

async function exportWork(kind){if(busy)return;if(!validScreens()){say('请先上传当前布局所需的截图。',true);return}if(kind==='GIF'&&!motion.enabled){say('请先在动效分区开启屏幕闪烁。',true);return}record();if(floating.classList.contains('mini')){floating.classList.remove('mini');$('gu-float-mini').textContent='−';place()}cancelled=false;setBusy(true);let base=null,work=null;try{say('正在生成 '+kind+'…');if(kind==='PNG'){const blob=await buildPNG();if(cancelled)throw Error('已取消生成');displayResult(blob,'PNG')}else{const b=await buildCanvas(+$('gu-gif-size').value);base=b.canvas;work=document.createElement('canvas');work.width=base.width;work.height=base.height;const g=work.getContext('2d',{willReadFrequently:true}),fps=+$('gu-gif-fps').value,steps=Math.max(2,Math.round(motion.period*fps));gifEngine=makeEngine();await gifEngine.call({type:'init',w:work.width,h:work.height});for(let j=0;j<steps;j++){if(cancelled)throw Error('已取消生成');g.fillStyle='#fff';g.fillRect(0,0,work.width,work.height);g.drawImage(base,0,0);drawFlash(g,b.screen,j*motion.period/steps);const delay=(Math.round((j+1)*motion.period*100/steps)-Math.round(j*motion.period*100/steps))*10;await gifEngine.call({type:'frame',data:g.getImageData(0,0,work.width,work.height).data.buffer,delay});$('gu-progress').value=(j+1)/steps*100;say('正在生成 GIF '+(j+1)+' / '+steps+' 帧');await new Promise(r=>setTimeout(r,0))}const done=await gifEngine.call({type:'finish'});if(cancelled)throw Error('已取消生成');displayResult(new Blob([done.buffer],{type:'image/gif'}),'GIF')}}catch(e){say(e.message||'生成失败',!cancelled)}finally{gifEngine?.close();gifEngine=null;if(base)base.width=base.height=1;if(work)work.width=work.height=1;setBusy(false)}}
