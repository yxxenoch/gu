<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2e9dd">
<meta name="description" content="布置小屋：点一下家具放进小屋，拖一拖摆好位置。两间房间，换墙换地板，存成图片。">
<title>布置小屋 · 咕の返图</title>
<style>
:root{--ink:#4c4035;--muted:#847a6b;--line:#ddd2c2;--paper:#f0ede6;--green:#7a5c40;--soft:#eee4d9;--white:#fdfbf7;--radius:18px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation}button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid #c9a584;outline-offset:3px}
input,select{max-width:100%;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
input[type=range]{padding:0;border:0;height:26px;width:100%;accent-color:var(--green);background:transparent}
input[type=color]{width:46px;height:42px;padding:4px}
a{color:var(--green)}[hidden]{display:none!important}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(240,237,230,.97);position:relative;z-index:30;gap:10px;padding-top:env(safe-area-inset-top);height:calc(64px + env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{width:34px;height:34px;border:1px solid #b7a99a;border-radius:50%;display:grid;place-items:center;font:21px Georgia,serif;color:var(--green)}
.brand h1{font:600 18px/1.2 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:3px;margin:0}
.brand small{font-size:9px;letter-spacing:2px;color:var(--muted)}
.top-actions{display:flex;gap:7px;align-items:center}
.button{min-height:40px;padding:9px 14px;border-radius:11px;background:var(--soft);font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.button.primary{background:var(--green);color:#fff}
.button.ghost{background:transparent;border:1px solid var(--line)}
.button:hover{filter:brightness(.97)}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr);height:calc(100svh - 64px - env(safe-area-inset-top))}
.stage-zone{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:#e6e0d3;background-image:radial-gradient(#b0a58e44 .7px,transparent .7px);background-size:13px 13px}
.rooms{display:flex;gap:6px;justify-content:center;padding:12px 12px 8px}
.rooms button{min-height:38px;padding:7px 18px;border-radius:20px;border:1px solid #cdc0aa;background:#f6f0e2;font-size:12.5px;color:#6b5d48}
.rooms button.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.stage-clip{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 18px 18px;min-height:0}
#stage{position:relative;width:min(100%,calc((100svh - 190px)*1.35));aspect-ratio:13.5/10;max-height:100%;border-radius:14px;overflow:hidden;box-shadow:0 18px 45px #4f3f2c30;touch-action:none;user-select:none}
#wall{position:absolute;inset:0 0 34%;background:#e8d8c8}
#wallpaper{position:absolute;inset:0 0 34%;opacity:.5}
#floor{position:absolute;inset:66% 0 0;background:#c9a684}
#baseboard{position:absolute;left:0;right:0;top:64.5%;height:1.8%;background:#f4ece0;box-shadow:0 2px 4px #0001}
.fur{position:absolute;left:0;top:0;transform-origin:0 0;cursor:grab;line-height:0;filter:drop-shadow(2px 4px 3px #3a2c1c22)}
.fur svg{width:100%;height:100%;overflow:visible}
.fur.sel{filter:drop-shadow(2px 4px 3px #3a2c1c22) drop-shadow(0 0 0.6px #7a5c40) drop-shadow(0 0 3px #7a5c40aa)}
.fur:active{cursor:grabbing}
.handle{position:absolute;width:26px;height:26px;right:-13px;bottom:-13px;border-radius:50%;background:#fdfaf0;border:2px solid #7a5c40;display:grid;place-items:center;font-size:13px;color:#7a5c40;cursor:nwse-resize;touch-action:none}
.itembar{position:absolute;z-index:60;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:6px;background:#fdfaf0ee;border:1px solid #ddd0b8;border-radius:14px;padding:6px 8px;box-shadow:0 8px 24px #4f3f2c30}
.itembar button{min-width:38px;min-height:34px;border-radius:9px;background:#f0e8d6;font-size:14px}
.itembar button.del{background:#f6e2de;color:#9a4a3a}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#4c4035cc;color:#f4ecd8;border-radius:20px;padding:6px 14px;font-size:11.5px;pointer-events:none;white-space:nowrap;transition:opacity .5s}
.side{border-left:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;min-width:0;min-height:0}
.side-head{padding:16px 18px 0}
.side-head h2{font-size:15px;font-weight:600;margin:0 0 2px}
.side-head p{font-size:11.5px;color:var(--muted);margin:0 0 10px}
.palette{flex:1;overflow-y:auto;padding:4px 16px 16px;min-height:0}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal{border:1px solid var(--line);border-radius:12px;background:#fbf7ee;padding:8px 4px 6px;text-align:center;cursor:pointer}
.pal:hover{background:#f6efdd}
.pal svg{width:100%;height:44px}
.pal small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pal-cat{font-size:11px;color:#9c8c62;letter-spacing:.12em;margin:12px 0 7px}
.side-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.side-foot .row{display:flex;gap:7px}
.side-foot .row .button{flex:1}
.color-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.color-row label{display:flex;align-items:center;gap:6px;flex:1}
.return-home{position:fixed;bottom:12px;right:12px;z-index:150;background:#4c4035;color:#fff;padding:8px 12px;border-radius:12px;text-decoration:none;font-size:12px}
@media(max-width:760px){.workbench{display:flex;flex-direction:column}.stage-zone{flex:1;min-height:0}#stage{width:min(96vw,calc((100svh - 320px)*1.35))}.side{border-left:0;border-top:1px solid var(--line);flex:none;height:236px}.palette{padding:4px 12px 8px}.side-head{display:none}.side-foot{display:none}.pal-grid{grid-template-columns:repeat(4,1fr)}.topbar{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><span class="brand-mark">屋</span><div><h1>布置小屋</h1><small>LITTLE COTTAGE / NEW ROOM</small></div></div>
 <div class="top-actions"><button class="button ghost" id="undo">↶ 撤销</button><button class="button ghost" id="reset">重置</button><button class="button primary" id="done">完成 ✓</button></div>
</header>
<main class="workbench">
 <section class="stage-zone">
  <div class="rooms"><button data-room="0" class="active">房间一</button><button data-room="1">房间二 · 阁楼</button></div>
  <div class="stage-clip">
   <div id="stage" aria-label="小屋场景：拖家具摆位置">
    <div id="wall"></div><div id="wallpaper"></div><div id="floor"></div><div id="baseboard"></div>
    <div id="items"></div>
    <div class="hint" id="hint">点下面的家具放进小屋 · 拖动摆放</div>
    <div class="itembar" id="itembar" hidden>
     <button data-op="smaller" title="缩小">－</button><button data-op="bigger" title="放大">＋</button>
     <button data-op="down" title="下移一层">⬇</button><button data-op="up" title="上移一层">⬆</button>
     <button data-op="flip" title="左右翻转">⇋</button><button data-op="copy" title="再来一件">⧉</button>
     <button data-op="del" class="del" title="拿走">🗑</button>
    </div>
   </div>
  </div>
 </section>
 <aside class="side">
  <div class="side-head"><h2>家具（点一下放进小屋）</h2><p>拖动摆位置 · 角上圆点拉大小 · 选中后下方有操作</p></div>
  <div class="palette" id="palette"></div>
  <div class="side-foot">
   <div class="color-row">
    <label>墙色<input type="color" id="wall-c" value="#e8d8c8"></label>
    <label>地板<input type="color" id="floor-c" value="#c9a684"></label>
   </div>
   <div class="row"><button class="button ghost" id="save-png">存成图片</button></div>
  </div>
 </aside>
</main>
<a href="./islands.html" class="return-home">🕊 回鸽群</a>

const itemWH=it=>({w:FURN[it.t].w*it.s*stageK(),h:FURN[it.t].h*it.s*stageK()});
function placeEl(el,it){const{w,h}=itemWH(it),px=it.x*stage.clientWidth,py=it.y*stage.clientHeight;
 el.style.width=w+'px';el.style.height=h+'px';
 el.style.transform=it.f?`translate(${px+w}px,${py}px) scaleX(-1)`:`translate(${px}px,${py}px)`;}
let room=0,items=rooms[0].items,sel=null,undoStack=[];
let uid=0;
function pushUndo(){undoStack.push(JSON.stringify(rooms));if(undoStack.length>60)undoStack.shift()}
function paintRoom(){const r=rooms[room];$('#wall').style.background=r.wall;$('#floor').style.background=r.floor;
 $('#wallpaper').style.backgroundImage=`radial-gradient(${shade(r.wall,-12)} 1.1px,transparent 1.3px)`;$('#wallpaper').style.backgroundSize='17px 17px';
 $('#wall-c').value=r.wall;$('#floor-c').value=r.floor;}
function shade(h,amt){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,k=amt>0?255:0,t=Math.abs(amt)/100;
 const f=v=>Math.round(v+(k-v)*t);return`rgb(${f(r)},${f(g)},${f(b)})`}
function renderItems(){itemsBox.replaceChildren();items.forEach((it,i)=>{
 const el=document.createElement('div');el.className='fur'+(i===sel?' sel':'');el.dataset.i=i;
 el.innerHTML=FURN[it.t].s+'<span class="handle" hidden>⤡</span>';
 el.style.zIndex=10+i;placeEl(el,it);
 el.addEventListener('pointerdown',e=>startDrag(e,i));
 itemsBox.append(el);});
 if(sel!=null&&sel>=items.length)sel=null;bar.hidden=sel==null;
 if(sel!=null){const el=itemsBox.children[sel];if(!el)return;
  el.classList.add('sel');const dim=itemWH(items[sel]),h=el.querySelector('.handle');
  /* 家具太小手柄会把它整个盖住，藏掉手柄保留下拖动 */
  if(h)h.hidden=dim.w<52||dim.h<34;}
 positionBar();}
function positionBar(){if(sel==null){bar.hidden=true;return}bar.hidden=false;
 const el=itemsBox.children[sel];if(!el)return;
 const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();
 const bw=bar.offsetWidth||250,cx=(r.left+r.right)/2-sr.left;
 bar.style.left=Math.max(bw/2+4,Math.min(sr.width-bw/2-4,cx))+'px';
 const bh=bar.offsetHeight||44;
 bar.style.bottom=(r.top-sr.top<bh+14?sr.bottom-r.bottom+8:sr.bottom-r.top+8)+'px';}
function addItem(t){pushUndo();
 items.push({t,x:.42,y:.4,s:1,f:0});sel=items.length-1;renderItems();$('#hint').style.opacity=0}
/* palette */
$('#palette').innerHTML=CATS.map(([c,ids])=>'<div class="pal-cat">'+c+'</div><div class="pal-grid">'+ids.map(t=>'<div class="pal" data-t="'+t+'" role="button" tabindex="0">'+FURN[t].s+'<small>'+FURN[t].n+'</small></div>').join('')+'</div>').join('');
$('#palette').addEventListener('click',e=>{const p=e.target.closest('.pal');if(p)addItem(p.dataset.t)});
$('#palette').addEventListener('keydown',e=>{const p=e.target.closest('.pal');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();addItem(p.dataset.t)}});
/* drag & resize */
let drag=null;
function startDrag(e,i){const it=items[i];sel=i;renderItems();const el=itemsBox.children[i];
 const handle=e.target.closest('.handle');
 drag={i,mode:handle?'scale':'move',x0:e.clientX,y0:e.clientY,ox:it.x,oy:it.y,s0:it.s,moved:false};
 stage.setPointerCapture(e.pointerId);e.preventDefault();}
stage.addEventListener('pointermove',e=>{if(!drag)return;const it=items[drag.i];if(!it)return;
 const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;if(Math.hypot(dx,dy)>3)drag.moved=true;
 if(drag.mode==='move'){it.x=drag.ox+dx/stage.clientWidth;it.y=drag.oy+dy/stage.clientHeight;}
 else{it.s=Math.max(.35,Math.min(3,drag.s0+(dx+dy)/(FURN[it.t].w*1.4*stageK())));}
 placeEl(itemsBox.children[drag.i],it);
 positionBar();});
stage.addEventListener('pointerup',()=>{if(drag&&drag.moved&&preDrag){undoStack.push(preDrag);if(undoStack.length>60)undoStack.shift()}preDrag=null;drag=null;});
stage.addEventListener('pointerdown',e=>{if(e.target===stage||e.target.id==='wall'||e.target.id==='floor'||e.target.id==='wallpaper'||e.target.id==='baseboard'){sel=null;renderItems();}});
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||sel==null)return;const it=items[sel];pushUndo();
 const op=b.dataset.op;
 if(op==='del'){items.splice(sel,1);sel=null}
 else if(op==='flip')it.f=!it.f;
 else if(op==='copy'){items.splice(sel+1,0,{...it,x:it.x+.035,y:it.y+.03});sel++}
 else if(op==='bigger')it.s=Math.min(3,it.s*1.18);
 else if(op==='smaller')it.s=Math.max(.35,it.s/1.18);
 else if(op==='up'&&sel<items.length-1){[items[sel],items[sel+1]]=[items[sel+1],items[sel]];sel++}
 else if(op==='down'&&sel>0){[items[sel],items[sel-1]]=[items[sel-1],items[sel]];sel--}
 renderItems();});
/* 舞台尺寸变化时按新比例重摆（坐标本身不变） */
new ResizeObserver(()=>renderItems()).observe(stage);
/* snapshot before each drag for undo */
let preDrag=null;
stage.addEventListener('pointerdown',()=>{preDrag=JSON.stringify(rooms)},true);
$('#undo').onclick=()=>{const s=undoStack.pop();if(!s)return;const keep=room;const data=JSON.parse(s);rooms[0]=data[0];rooms[1]=data[1];items=rooms[room].items;sel=null;paintRoom();renderItems();};
$('#reset').onclick=()=>{pushUndo();rooms[room].items=[];items=rooms[room].items;sel=null;renderItems();};
document.querySelectorAll('.rooms button').forEach(b=>b.onclick=()=>{room=+b.dataset.room;items=rooms[room].items;sel=null;
 document.querySelectorAll('.rooms button').forEach(x=>x.classList.toggle('active',x===b));paintRoom();renderItems();});
$('#wall-c').addEventListener('input',e=>{rooms[room].wall=e.target.value;paintRoom()});
$('#floor-c').addEventListener('input',e=>{rooms[room].floor=e.target.value;paintRoom()});
$('#wall-c').addEventListener('change',pushUndo);$('#floor-c').addEventListener('change',pushUndo);
addEventListener('keydown',e=>{if(e.key==='Delete'||e.key==='Backspace'){if(sel!=null&&document.activeElement.tagName!=='INPUT'){pushUndo();items.splice(sel,1);sel=null;renderItems()}}});
/* ———— 导出 PNG ———— */
const W2=1080,H2=800;
function svgImage(svg,w,h){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))})}
async function exportPNG(){const c=document.createElement('canvas');c.width=W2;c.height=H2;const g=c.getContext('2d');
 const r=rooms[room];
 g.fillStyle=r.wall;g.fillRect(0,0,W2,H2*.66);
 g.fillStyle=shade(r.wall,-12);for(let y=0;y<H2*.66;y+=22)for(let x=0;x<W2;x+=22)g.fillRect(x+10,y+10,3,3);
 g.fillStyle='#f4ece0';g.fillRect(0,H2*.645,W2,H2*.018);
 g.fillStyle=r.floor;g.fillRect(0,H2*.66,W2,H2*.34);
 g.strokeStyle=shade(r.floor,-18);g.lineWidth=2;for(let i=0;i<9;i++){g.beginPath();g.moveTo(0,H2*.66+i*H2*.038);g.lineTo(W2,H2*.66+i*H2*.038);g.stroke()}
 /* 与屏幕上一致：家具像素尺寸按舞台实测比例换算，避免异形舞台裁掉边缘家具；
    舞台被挤成一条线（手机横屏）时用参考尺寸兜底 */
 const collapsed=stage.clientWidth<20||stage.clientHeight<20;
 const sx=W2/Math.max(1,stage.clientWidth),sy=H2/Math.max(1,stage.clientHeight),
       ek=collapsed?0:stageK(),ek0=Math.min(W2/810,H2/600);
 for(const it of items){const f=FURN[it.t];const img=await svgImage(f.s,f.w,f.h);
  const w=collapsed?f.w*it.s*ek0:f.w*it.s*ek*sx,
        h=collapsed?f.h*it.s*ek0:f.h*it.s*ek*sy,px=it.x*W2,py=it.y*H2;
  g.save();if(it.f){g.translate(px+w,py);g.scale(-1,1)}else g.translate(px,py);
  g.drawImage(img,0,0,w,h);g.restore();}
 const a=document.createElement('a');a.download='咕的小屋-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();}
$('#save-png').onclick=exportPNG;$('#done').onclick=exportPNG;
paintRoom();renderItems();setTimeout(()=>{$('#hint').style.opacity=.85},600);
})();
</script>
