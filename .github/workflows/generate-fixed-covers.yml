name: Generate fixed template gallery covers
on:
  push:
    paths:
      - '.github/workflows/generate-fixed-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - name: Capture the initial default canvas of each template
        run: node scripts/create-static-template-covers.mjs
      - name: Commit fixed cover images
        if: always()
        run: |
          if [ ! -d assets/template-covers ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/template-covers
          if git diff --cached --quiet; then
            echo "No new cover images."
          else
            git commit -m "assets: add fixed default preview images for fifteen templates"
            git push
          fi
