name: Build fixed template gallery covers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-gallery-covers.yml'
      - 'scripts/render-gallery-covers.cjs'

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local snapshot renderer
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture the default design of each template once
        run: node scripts/render-gallery-covers.cjs
      - name: Commit the fixed WebP covers
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery-covers/
          if git diff --cached --quiet; then
            echo "Default covers already committed"
          else
            git commit -m "assets: capture fifteen static default template previews"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
