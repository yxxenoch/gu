<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:"><title>标题高亮预览 · 咕の返图</title><style>
*{box-sizing:border-box}body{margin:auto;max-width:760px;background:#f4f2eb;color:#33493d;font:16px/1.6 system-ui;padding:20px}a{color:inherit}section{margin:14px 0;background:#fffdf7;border:1px solid #d7dbcf;border-radius:14px;padding:16px}button,input,select,textarea{font:inherit;max-width:100%}button,select,input{border:1px solid #bbc8bd;border-radius:8px;padding:5px 9px;background:#fafbf5;color:#33493d}button{cursor:pointer;margin:3px}textarea{width:100%;height:7em}#paper{overflow:hidden;overflow-wrap:anywhere;font-family:serif}#sample{max-width:100%;margin:0}label{display:block;margin:7px 0}#paper p{text-indent:2em}small{display:block}
#makerPaper{padding:1.2em;text-align:center;background:#f6efdd;border-radius:8px;margin:12px 0}#makerPreview{display:inline-block;max-width:100%;overflow-wrap:anywhere}@keyframes title-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes reeden-fade-in{from{opacity:0}to{opacity:1}}@keyframes reeden-float{50%{transform:translateY(-4px)}}
@keyframes reeden-breathe{50%{transform:scale(1.05);opacity:.75}}
@keyframes reeden-blink{50%{opacity:.25}}
@keyframes reeden-shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes reeden-rainbow{0%,100%{color:#b74767}33%{color:#387c62}66%{color:#6055ba}}
@keyframes reeden-pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.09)}100%{transform:scale(1);opacity:1}}
@keyframes reeden-spin{to{transform:rotate(360deg)}}
@keyframes reeden-sweep{0%,100%{text-shadow:-1em 0 .4em transparent}50%{text-shadow:0 0 .45em #fff;color:#b38a48}}#diagram{position:relative;width:fit-content;max-width:100%;margin:auto}#cutImage{display:block;max-width:100%;max-height:240px}#diagram i{position:absolute;background:#df3965;pointer-events:none}#line0,#line2{top:0;height:100%;width:1px}#line1,#line3{left:0;width:100%;height:1px}</style><nav><a href="./">咕の返图</a> ／ <a href="./theme-tools.html">主题工具</a> ／ 标题高亮</nav><h1>标题高亮预览</h1><section id="maker"><h2>制作标题特效</h2><label>标题动效 <select id="effect"><option value="float">浮动</option><option value="breathe">呼吸</option><option value="blink">闪烁</option><option value="shake">抖动</option><option value="rainbow">彩虹变色</option><option value="pop">弹出</option><option value="spin">旋转</option><option value="fade-in">淡入</option><option value="sweep">扫光</option><option value="still">静态</option></select></label><label>标题底图 <input id="picture" type="file" accept="image/png,image/gif,image/jpeg,image/webp"></label><label>Reeden 图片 ID <input id="pictureId" placeholder="仅单独导出 CSS / JSON 时填写"></label><small>下载 .red 会自动绑定本地底图，无需填写 ID。</small><details id="cuts" hidden><summary>调整底图 9S（九切片）</summary><label><input type="checkbox" id="nineOn">启用九切片</label><div id="diagram"><img id="cutImage" alt="原图与切线"><i id="line0"></i><i id="line1"></i><i id="line2"></i><i id="line3"></i></div><label>左切线 <input id="cut0" type="range" min="0" step="1"><output id="num0"></output></label><label>上切线 <input id="cut1" type="range" min="0" step="1"><output id="num1"></output></label><label>右切线 <input id="cut2" type="range" min="0" step="1"><output id="num2"></output></label><label>下切线 <input id="cut3" type="range" min="0" step="1"><output id="num3"></output></label><label>九切片缩放 <input id="sliceScale" type="range" min="5" max="150" value="100"><output id="scaleValue"></output></label></details><label>标题文字 <input id="makerTitle" value="山间来信"></label><div id="makerPaper"><strong id="makerPreview"></strong></div><button id="saveRed">一键下载 .red（含底图）</button><button id="saveCss">下载 CSS</button><button id="saveJson">下载规则 JSON</button><small id="makerStatus" role="status"></small></section><section><h2>预览已有规则</h2><button id="paste">粘贴并识别</button><button id="choose">打开 JSON 文件</button><input hidden id="file" type="file" accept=".json,.txt"><textarea id="code" aria-label="高亮规则 JSON"></textarea><button id="apply">应用 JSON</button><label>标题规则 <select id="rules"></select></label><label id="assetLabel" hidden>本地背景图 <input id="asset" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label><small id="status" role="status"></small></section><section><label>章节标题 <input id="titleInput" value="山间来信"></label><button id="short">短标题</button><button id="long">长标题</button><label>阅读外观 <select id="mode"><option>日间</option><option>夜间</option></select></label><label>阅读字号 <input id="size" type="range" min="12" max="32" value="18"> <output id="px"></output></label></section><section id="paper"><h2 id="sample"></h2><p>雨停以后，窗边的书页在风里轻轻翻动。</p></section><script>
const el=id=>document.getElementById(id);
let rules=[],assets=new Map();
const allowed=/^(color|background-(color|size|position|repeat)|font-(size|weight|style)|text-(align|shadow|decoration)|letter-spacing|line-height|padding(-top|-left|-bottom|-right)?|border(-radius|-width|-color|-style)?)$/;
function render(){
 const rule=rules[el('rules').selectedIndex], title=el('sample'), night=el('mode').selectedIndex===1, ink=night?'#e4dfcc':'#403d33';
 el('paper').style.background=night?'#282d2b':'#f8f1df';el('paper').style.color=ink;el('paper').style.fontSize=el('size').value+'px';el('px').textContent=el('size').value+' px';
 title.textContent=el('titleInput').value;title.removeAttribute('style');el('assetLabel').hidden=true;
 if(!rule)return;
 const warnings=[], props={},unknown=[];
 for(const d of (rule.css||'').split(';')){const i=d.indexOf(':');if(i>0)props[d.slice(0,i).trim().toLowerCase()]=d.slice(i+1).trim().replaceAll('{primaryColor}',ink)}
 for(const [k,v] of Object.entries(props)){if(allowed.test(k)&&CSS.supports(k,v))title.style.setProperty(k,v);else if(k!=='background-image'&&!['reeden-background-nine-slice','reeden-background-nine-slice-scale'].includes(k))unknown.push(k)}
 const bg=props['background-image'],url=assets.get(bg);
 if(bg){el('assetLabel').hidden=false;if(url)title.style.backgroundImage='url('+url+')';else warnings.push('请选择规则对应的本地背景图')}
 if(props['reeden-background-nine-slice']){
 const parts=props['reeden-background-nine-slice'].split('/').map(p=>p.trim().split(/\s+/).map(Number));
 const [l,t,r,b]=parts[0],[w,h]=parts[1]||[],scale=parseFloat(props['reeden-background-nine-slice-scale']||'100')/100;
 if(url&&[l,t,r,b,w,h,scale].every(Number.isFinite)&&l>=0&&t>=0&&w>=r&&h>=b&&r>l&&b>t&&scale>0){let edges=[t,w-r,h-b,l];title.style.backgroundImage='none';title.style.borderImageSource='url('+url+')';title.style.borderImageSlice=edges.map((v,i)=>100*v/(i%2?w:h)+'%').join(' ')+' fill';title.style.borderImageWidth=edges.map(v=>v*scale+'px').join(' ');warnings.push('九切片按浏览器近似显示');if(parts.length>2)warnings.push('未模拟九切片内容区')}
 }
 if(rule.keyword)warnings.push('手动预览所选规则，未模拟关键词匹配');
 if(unknown.length)warnings.push('未模拟：'+unknown.join('、'));
 el('status').textContent=['已载入 '+rules.length+' 条标题规则',...warnings].join('。');
}
function apply(){try{const data=JSON.parse(el('code').value);if(data.reedenHighlightRules!==1||!Array.isArray(data.rules))throw Error('请使用 Reeden 高亮规则 JSON');rules=data.rules.filter(r=>r&&r.target==='title'&&typeof r.css==='string');if(!rules.length)throw Error('没有找到标题规则');el('rules').replaceChildren(...rules.map((r,i)=>new Option(r.name||'标题规则 '+(i+1),i)));render()}catch(e){rules=[];el('rules').replaceChildren();render();el('status').textContent=e.message}}
el('apply').onclick=apply;el('paste').onclick=async()=>{try{el('code').value=await navigator.clipboard.readText();apply()}catch{el('code').focus();el('status').textContent='请在输入框长按粘贴，随后会自动识别。'}};
el('code').onpaste=()=>setTimeout(apply,0);el('choose').onclick=()=>el('file').click();el('file').onchange=async e=>{const f=e.target.files[0];if(f){el('code').value=await f.text();apply();e.target.value=''}};
el('asset').onchange=e=>{const file=e.target.files[0],rule=rules[el('rules').selectedIndex];if(file&&rule){const key=rule.css.match(/(?:^|;)\s*background-image\s*:\s*([^;]+)/i)?.[1].trim();if(assets.has(key))URL.revokeObjectURL(assets.get(key));assets.set(key,URL.createObjectURL(file));render();e.target.value=''}};
for(const id of ['rules','mode','size','titleInput'])el(id).oninput=render;
for(const [id,text] of [['short','来信'],['long','第十二章　沿着山间石阶一直走到那座亮着灯的小屋']])el(id).onclick=()=>{el('titleInput').value=text;render()};
el('code').value=JSON.stringify({reedenHighlightRules:1,rules:[{name:'示例标题',target:'title',keyword:'',css:'color: {primaryColor}; background-color: #c9c8a2; padding: 0.4em 0.8em; border-radius: 6px; text-align: center;'}]},null,2);apply();

let pictureUrl='';
function slice(preview){
 const img=el('cutImage'),w=img.naturalWidth,h=img.naturalHeight;
 if(!pictureUrl||el('cuts').hidden||!el('nineOn').checked||!w||!h)return [];
 const [l,t,r,b]=[0,1,2,3].map(i=>+el('cut'+i).value),scale=+el('sliceScale').value;
 if(!preview)return ['reeden-background-nine-slice: '+[l,t,r,b].join(' ')+' / '+w+' '+h,'reeden-background-nine-slice-basis: bubble','reeden-background-nine-slice-scale: '+scale+'%'];
 const edges=[t,w-r,h-b,l];
 return ['background-image:none','border-image-source:url("'+pictureUrl+'")','border-image-slice:'+edges.join(' ')+' fill','border-image-width:'+edges.map(x=>(x*scale/100)+'px').join(' ')]
}
function buildStyle(preview,packing=false){
 const id=el('pictureId').value.trim(), effect=el('effect').value;
 const declarations=['text-align: center','display: inline-block','padding: 0.7em 1.4em','line-height: 1.5','color: '+(preview?'inherit':'{primaryColor}')];
 const image=preview?pictureUrl:packing?null:id;
 if(image)declarations.push('background-image: url("'+image+'")');
 if(image||(packing&&pictureUrl))declarations.push('background-size: contain','background-position: center','background-repeat: no-repeat');
 if(effect!=='still'){
  const once=['pop','fade-in'].includes(effect);
  declarations.push('animation: reeden-'+effect+(once?' 1.2s ease-out 1 forwards':' 2.4s ease-in-out infinite'));
 }
 return declarations.concat(slice(preview)).join(';\n')+';'
}
function showMaker(){const preview=el('makerPreview');preview.textContent=el('makerTitle').value;preview.style.cssText=buildStyle(true)}
el('picture').onchange=e=>{const file=e.target.files[0];if(pictureUrl)URL.revokeObjectURL(pictureUrl);pictureUrl=file?URL.createObjectURL(file):'';el('pictureId').value='';el('cuts').hidden=true;el('nineOn').checked=false;if(file)el('cutImage').src=pictureUrl;showMaker()};
function syncCuts(){
 const img=el('cutImage');
 for(let i=0;i<4;i++){const field=el('cut'+i),axis=i%2?'top':'left';el('line'+i).style[axis]=100*field.value/(i%2?img.naturalHeight:img.naturalWidth)+'%';el('num'+i).textContent=field.value+' px'}
 el('scaleValue').textContent=el('sliceScale').value+'%';showMaker()
}
el('cutImage').onload=()=>{const img=el('cutImage');[0,1,2,3].forEach(i=>{const field=el('cut'+i),dim=i%2?img.naturalHeight:img.naturalWidth;field.max=dim;field.value=i<2?Math.floor(dim/3):Math.ceil(dim*2/3);field.oninput=()=>{const other=+el('cut'+((i+2)%4)).value;field.value=i<2?Math.min(+field.value,other-1):Math.max(+field.value,other+1);el('nineOn').checked=true;syncCuts()}});el('cuts').hidden=false;syncCuts()};
el('nineOn').onchange=syncCuts;el('sliceScale').oninput=syncCuts;
el('makerTitle').oninput=showMaker;el('effect').onchange=showMaker;
function saveStyle(json){
 const id=el('pictureId').value.trim();
 if((pictureUrl&&!id)||(id&&!/^[a-zA-Z0-9_-]+$/.test(id))){el('makerStatus').textContent='请填写这张底图在 Reeden 里的图片 ID。';el('pictureId').focus();return}
 const css=buildStyle(false);
 const data=json?JSON.stringify({reedenHighlightRules:1,rules:[{name:'标题特效',keyword:'',target:'title',css}]},null,2):css;
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:json?'application/json':'text/css;charset=utf-8'}));a.href=url;a.download='标题特效.'+(json?'json':'css');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);el('makerStatus').textContent='已生成下载文件。'
}
el('saveCss').onclick=()=>saveStyle(false);el('saveJson').onclick=()=>saveStyle(true);showMaker();
function imageMd5(bytes) {
 const data=new Uint8Array(Math.ceil((bytes.length+9)/64)*64);
 data.set(bytes);data[bytes.length]=128;
 const view=new DataView(data.buffer);
 view.setBigUint64(data.length-8,BigInt(bytes.length)*8n,true);
 const state=new Int32Array([0x67452301,0xefcdab89,0x98badcfe,0x10325476]);
 const shifts=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
 const constants=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*2**32));
 for(let offset=0;offset<data.length;offset+=64){
  let [a,b,c,d]=state;
  for(let i=0;i<64;i++){
   const round=i>>4, index=[i,(5*i+1)%16,(3*i+5)%16,(7*i)%16][round];
   const f=[(b&c)|(~b&d),(d&b)|(~d&c),b^c^d,c^(b|~d)][round];
   const v=(a+f+constants[i]+view.getUint32(offset+4*index,true))|0;
   const shift=shifts[round*4+i%4];
   [a,b,c,d]=[d,(b+((v<<shift)|(v>>>(32-shift))))|0,b,c];
  }
  ;[a,b,c,d].forEach((x,i)=>state[i]+=x)
 }
 return Array.from(state,x=>[0,8,16,24].map(s=>((x>>>s)&255).toString(16).padStart(2,'0')).join('')).join('').toUpperCase()
}
function redArchive(entries){
 const contents=[],directory=[],enc=new TextEncoder();let offset=0;
 const header=n=>new DataView(new ArrayBuffer(n));
 const table=Array.from({length:256},(_,v)=>{for(let i=0;i<8;i++)v=(v>>>1)^((v&1)?0xedb88320:0);return v});
 for(const [path,value] of entries){
  const name=enc.encode(path),data=enc.encode(JSON.stringify(value));let crc=-1;
  for(const byte of data)crc=table[(crc^byte)&255]^(crc>>>8);
  crc=~crc;
  const local=header(30),central=header(46);
  local.setUint32(0,0x04034b50,true);central.setUint32(0,0x02014b50,true);central.setUint16(4,20,true);
  for(const [h,p] of [[local,4],[central,6]]){
   h.setUint16(p,20,true);h.setUint16(p+2,2048,true);h.setUint16(p+8,33,true);h.setUint32(p+10,crc,true);
   h.setUint32(p+14,data.length,true);h.setUint32(p+18,data.length,true);h.setUint16(p+22,name.length,true)
  }
  central.setUint32(42,offset,true);contents.push(local.buffer,name,data);directory.push(central.buffer,name);offset+=30+name.length+data.length
 }
 const end=header(22);end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
 end.setUint32(12,directory.reduce((n,x)=>n+x.byteLength,0),true);end.setUint32(16,offset,true);
 return new Blob([new Uint8Array([82,69,68,4]),...contents,...directory,end.buffer],{type:'application/octet-stream'})
}
async function titleRed(file,css){
 const id=crypto.randomUUID(), rule={name:'标题特效',keyword:'',isRegex:false,titleOnly:true,target:'title',enabled:true,sortOrder:0,global:true,styleType:'background',styleColorType:'teal',styleMode:'advanced',styleCssText:css};
 if(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  rule.styleCssText='background-image: url("'+imageMd5(bytes)+'");\n'+css;
  const compressed=new Uint8Array(await new Response(file.stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let binary='';for(let i=0;i<compressed.length;i+=8192)binary+=String.fromCharCode(...compressed.subarray(i,i+8192));
  rule.backgroundImageData=btoa(binary)
 }
 const theme={name:'标题特效'},entries=[['manifest.json',{version:1,type:'multi_theme',count:1}],['0/theme.json',theme]];
 for(const mode of ['light','dark']){
  const sid=crypto.randomUUID(),bg=mode==='light'?'#FAF7ED':'#252A28',fg=mode==='light'?'#354538':'#DEDCD2';
  theme[mode]={readerColorSchemaId:sid,primaryColor:'#FF'+fg.slice(1),backgroundColor:'#FF'+bg.slice(1),foregroundColor:'#FF'+fg.slice(1)};
  entries.push(['reader_schema/'+sid+'/schema.json',{name:'标题特效',themeMode:mode,backgroundColor:bg,textColor:fg,primaryColor:fg,layoutConfig:'{}',boundHighlightRuleIds:[id],boundHighlightRules:[{id,rule}]}])
 }
 return redArchive(entries)
}

el('saveRed').onclick=async()=>{
 const button=el('saveRed');button.disabled=true;
 try{
  const blob=await titleRed(el('picture').files[0],buildStyle(false,true));
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='标题特效.red';
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);el('makerStatus').textContent='已生成标题特效.red，请在 Reeden 中导入主题包。'
 }catch(e){el('makerStatus').textContent='打包失败：'+e.message}finally{button.disabled=false}
};
</script></html>
