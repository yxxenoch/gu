function pathToStitches(points,step=15){let out='', t=0, idx=0;for(let j=0;j<points.length-1;j++){let [ax,ay]=points[j],[bx,by]=points[j+1];const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),tx=dx/len,ty=dy/len,nx=-ty,ny=tx;const count=Math.floor(len/step);for(let k=0;k<count;k++){let dist=step*(k+.5),v=(Math.sin(idx*31.12)*.9);let x=ax+tx*dist+v*tx,y=ay+ty*dist+v*ty;let inner=15+(idx%5)*.7;out+=`M${rnd(x-nx*6)},${rnd(y-ny*6)} L${rnd(x+nx*inner)},${rnd(y+ny*inner)} M${rnd(x+nx*inner)},${rnd(y+ny*inner)} l${rnd(tx*3)},${rnd(ty*3)} `;idx++}}return out}

<pattern id="linen" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${c.cloth}"/><path d="M0 1h9M0 5h9" stroke="#fff" stroke-width=".65" opacity=".36"/><path d="M2 0v9M6 0v9" stroke="#745c46" opacity=".16" stroke-width=".65"/><path d="M4 2l1 1M7 7l1 1" stroke="#8d806f" opacity=".16" stroke-width=".4"/></pattern>

html+=`<div class="section"><div class="section-heading">标签文字</div><div class="control"><label>主题名</label><input class="field" data-text="title" value="${escapeHTML(S.text.title)}" maxlength="40" placeholder="主题名"></div><div class="control"><label>制作者</label><input class="field" data-text="maker" value="${escapeHTML(S.text.maker)}" maxlength="50" placeholder="制作者"></div><div class="pickergrid" style="margin-bottom:12px"><label>文字颜色<input class="field" type="color" data-textcolor="color" value="${escapeHTML(S.text.color||'#74584f')}"></label><label>文字风格<select class="field" data-textfont="font"><option value="serif" ${S.text.font==='serif'?'selected':''}>古典衬线</option><option value="sans" ${S.text.font==='sans'?'selected':''}>简洁黑体</option><option value="italic" ${S.text.font==='italic'?'selected':''}>复古斜体</option></select></label></div>${slider('主题名字号','textSize',10,30,1,S.text.size||18,'px')}<p class="hint">文字绣签就在右侧尖角附近，可以直接点中移动。支持中文和英文，导出会保留文字。</p><button class="btn" data-select="label">选中并移动文字</button></div>`
} else if(activeTab==='export'){
html+=`<div class="section"><div class="section-heading">将作品收进口袋</div><p class="hint">导出保持 1200 × 760 的画布比例，建议高清 2 倍。所有上传图片都只在你的浏览器本地处理，不会上传到服务器。</p><div class="row"><button class="btn gold" data-export="png2">高清 PNG · 2×</button><button class="btn" data-export="png1">标准 PNG · 1×</button></div></div>`;
html+=`<div class="section"><div class="section-heading">保存这次搭配</div><div class="row"><button class="btn" id="saveProject">保存工程 JSON</button><button class="btn" id="loadProject">导入工程</button></div><p class="hint">工程文件包含布料配色、元素位置及上传的图片，之后打开还能继续编辑。</p></div><div class="section"><div class="section-heading">继续改造的方向</div><p class="hint">这是一版静态可交互样机。翻折动效和 GIF 导出暂未加入，避免在基础视觉及触屏交互定型前引入不稳定因素。</p></div>`
}
panel.innerHTML=html}
function setTab(name){activeTab=name;paintPanel()}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
const icons={frame:'<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="#cbbf9f" stroke-width="1.6"/><rect x="6" y="6" width="8" height="8" rx="1.5" fill="#cbbf9f44"/></svg>',charm:'<svg viewBox="0 0 20 20"><path d="M8 3h4v6h5v4h-5v5H8v-5H3V9h5Z" fill="#c99a68" stroke="#5e402a" stroke-width="1"/></svg>',flower:'<svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.4" fill="#c96a6a"/><path d="M10 10.5v6M10 13q-4-1-5-4M10 13q4-1 5-4" stroke="#8ab29b" stroke-width="1.8" fill="none"/></svg>',sprig:'<svg viewBox="0 0 20 20"><path d="M10 17Q9 9 10 3" stroke="#a58aa5" stroke-width="1.6" fill="none"/><path d="M10 8Q5 7 4 4M10 11Q15 10 16 7M10 14Q6 13 5 10" stroke="#c9a8b8" stroke-width="1.4" fill="none"/></svg>',patch:'<svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" rx="2" fill="#6b4c59" stroke="#c8a0a4" stroke-width="1.4" stroke-dasharray="2 2"/></svg>',star:'<svg viewBox="0 0 20 20"><path d="M10 2l2 6h6l-5 4 2 7-5-4-5 4 2-7-5-4h6Z" fill="#d8b37b"/></svg>',label:'<svg viewBox="0 0 20 20"><rect x="2" y="6" width="16" height="9" rx="4.5" fill="none" stroke="#cbbf9f" stroke-width="1.4"/><path d="M6 10.5h8" stroke="#cbbf9f" stroke-width="1.4"/></svg>'};
function layoutFrames(frames){const n=frames.length;frames.forEach((f,i)=>{if(n<=3){f.w=168;f.h=310;f.x=600+(i-(n-1)/2)*268;f.y=372+(i%2?-8:8);f.rotation=[-2.4,1.6,-1.2][i%3]}else{const cols=Math.ceil(n/2),col=i%cols,row=(i/cols)|0;f.w=128;f.h=235;f.x=600+(col-(cols-1)/2)*(cols===2?300:228);f.y=row?476:268+(col%2?-6:6);f.rotation=(col%2?1.9:-1.9)*(row?-1:1)}})}
function setFrameCount(n){let frames=S.layers.filter(l=>l.type==='frame'),others=S.layers.filter(l=>l.type!=='frame');const names='一二三四五六';while(frames.length<n)frames.push({id:`frame${Date.now()%10000}${frames.length}`,type:'frame',name:`绣框 · ${names[frames.length]}`,x:0,y:0,w:168,h:310,scale:1,rotation:0,visible:true,image:null,frame:frames.length%2?'bead':'braid'});frames=frames.slice(0,n);layoutFrames(frames);S.layers=[...frames,...others]}
function addLayer(kind){const id=`custom${++uid}`,x=kind==='frame'?548:990,y=kind==='frame'?385:395;let types={frame:['frame','新增图片绣框',168,310],charm:['charm','木质护符',110,153],flower:['flower','田园小花',116,120],sprig:['sprig','刺绣叶枝',90,122],patch:['patch','古董补丁布',150,110],star:['star','星星刺绣',100,100]};let [type,name,w,h]=types[kind];update(()=>{S.layers.push({id,type,name,x,y,w,h,scale:1,rotation:0,visible:true,image:null,frame:'braid'});S.selected=id});setTab('layers');toast('图层已加入，拖动它试试')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function fileAsData(file){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
let exporting=false;
async function exportPng(scale=2){if(exporting)return;exporting=true;const old=S.selected;S.selected=null;render();try{const clone=scene.cloneNode(true);clone.removeAttribute('style');clone.setAttribute('width','1200');clone.setAttribute('height','760');clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.querySelectorAll('[data-handle]').forEach(el=>el.remove());let str=new XMLSerializer().serializeToString(clone);const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const canvas=document.createElement('canvas');canvas.width=1200*scale;canvas.height=760*scale;const cx=canvas.getContext('2d');cx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));if(!blob)throw Error('无法编码 PNG');downloadBlob(blob,`针线圣物匣_${new Date().toISOString().slice(0,10)}_${scale}x.png`);toast('高清 PNG 已导出')}catch(e){console.error(e);toast('导出失败：'+e.message+'。可试标准 PNG。')}finally{S.selected=old;render();exporting=false}}
function setImageTarget(id){uploadTarget=id;document.getElementById('imageInput').click()}
document.getElementById('imageInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>38*1024*1024){toast('单张图片请不超过 38 MB');e.target.value='';return}try{const data=await fileAsData(f);update(()=>{const l=layer(uploadTarget);if(l)l.image=data});toast('图片已缝进相框，可以拖动调整')}catch(err){toast('读取图片失败')}e.target.value=''});
document.getElementById('bgInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{let data=await fileAsData(f);update(()=>S.background=data);toast('背景已更换')}catch(err){toast('背景读取失败')}e.target.value=''});
document.getElementById('projectInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{const q=JSON.parse(await f.text());if(!q.layers||!q.colors||!q.text||!Array.isArray(q.layers))throw Error();let b=snapshot();S=q;S.selected=S.layers[0]?.id||null;commit(b);render();paintPanel();toast('工程已载入')}catch(err){toast('工程格式不正确')}e.target.value=''});
function changeValue(el){const key=el.dataset.edit, l=layer(S.selected);if(!l)return;if(key==='frame'){update(()=>l.frame=el.value);return}let x=parseFloat(el.value);if(!Number.isFinite(x))return;update(()=>l[key]=x,false);const output=el.closest('.control')?.querySelector('output');if(output)output.textContent=rnd(x)+(key==='scale'?'×':key==='rotation'?'°':'px')}
panel.addEventListener('input',e=>{let el=e.target;if(el.dataset.textcolor){update(()=>S.text.color=el.value,false)}else if(el.dataset.textfont){update(()=>S.text.font=el.value,false)}else if(el.dataset.edit==='textSize'){update(()=>S.text.size=+el.value,false);el.closest('.control').querySelector('output').textContent=el.value+'px'}else if(el.dataset.color){let k=el.dataset.color;update(()=>{S.colors[k]=el.value;S.palette='custom'},false)}else if(el.dataset.text){let k=el.dataset.text;update(()=>S.text[k]=el.value,false)}else if(el.dataset.edit){if(el.dataset.edit==='textSize')return;if(el.dataset.edit==='backgroundOpacity'){update(()=>S.backgroundOpacity=+el.value,false);el.closest('.control').querySelector('output').textContent=el.value}else if(el.dataset.edit!=='frame')changeValue(el)}});
panel.addEventListener('change',e=>{if(e.target.dataset.textfont){update(()=>S.text.font=e.target.value);return}if(e.target.dataset.edit==='frame')changeValue(e.target)});
panel.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.select){S.selected=d.select;render();paintPanel();return}if(d.palette){update(()=>{S.colors={...palettes[d.palette]};S.palette=d.palette});return}if(d.count){update(()=>setFrameCount(+d.count));return}if(d.add){addLayer(d.add);return}if(d.upload){setImageTarget(d.upload);return}if(d.clearImage){update(()=>layer(d.clearImage).image=null);return}if(d.toggle){update(()=>{const l=layer(d.toggle);l.visible=!l.visible});return}if(d.front){update(()=>{const i=S.layers.findIndex(l=>l.id===d.front);S.layers.push(S.layers.splice(i,1)[0])});return}if(d.remove){update(()=>{S.layers=S.layers.filter(l=>l.id!==d.remove);S.selected=S.layers.at(-1)?.id||null});return}if(d.export){exportPng(d.export==='png2'?2:1);return}switch(el.id){case 'bgUpload':document.getElementById('bgInput').click();break;case 'bgClear':update(()=>S.background=null);break;case 'feltReset':update(()=>S.colors.felt=palettes[S.palette]?.felt||palettes.forest.felt);break;case 'saveProject':downloadBlob(new Blob([JSON.stringify({...S,selected:null},null,2)],{type:'application/json'}),'针线圣物匣_工程.json');toast('工程已保存');break;case 'loadProject':document.getElementById('projectInput').click();break}});
document.getElementById('quickExport').addEventListener('click',()=>exportPng(2));
document.getElementById('undo').addEventListener('click',()=>{if(!hist.length)return;future.push(snapshot());restore(hist.pop())});
document.getElementById('redo').addEventListener('click',()=>{if(!future.length)return;hist.push(snapshot());restore(future.pop())});
function point(e){const p=scene.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=scene.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
scene.addEventListener('pointerdown',e=>{let el=e.target.closest('[data-id]');if(!el)return;let id=el.dataset.id,l=layer(id);if(!l)return;document.querySelector('.stage-tip')?.classList.add('hide');const p=point(e),handle=e.target.closest('[data-handle]')?.dataset.handle||'move';S.selected=id;drag={id,handle,start:p,x:l.x,y:l.y,scale:l.scale,rotation:l.rotation,snapshot:snapshot()};moving=false;try{scene.setPointerCapture(e.pointerId)}catch{}render();paintPanel();e.preventDefault()});
scene.addEventListener('pointermove',e=>{if(!drag)return;const l=layer(drag.id);if(!l)return;let p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>2)moving=true;if(drag.handle==='move'){l.x=clamp(drag.x+dx,-80,1280);l.y=clamp(drag.y+dy,-80,840)}else if(drag.handle==='scale'){const d0=Math.hypot(drag.start.x-drag.x,drag.start.y-drag.y)||1,d1=Math.hypot(p.x-drag.x,p.y-drag.y);l.scale=clamp(drag.scale*d1/d0,.25,3.5)}else if(drag.handle==='rotate'){const a0=Math.atan2(drag.start.y-drag.y,drag.start.x-drag.x),a1=Math.atan2(p.y-drag.y,p.x-drag.x);l.rotation=rnd(drag.rotation+(a1-a0)*180/Math.PI)}const g=Array.from(scene.querySelectorAll('g.scene-layer')).find(node=>node.dataset.id===l.id);if(g)g.setAttribute('transform',`translate(${rnd(l.x)} ${rnd(l.y)}) rotate(${rnd(l.rotation)}) scale(${rnd(l.scale)})`);e.preventDefault()});
function stopDrag(e){if(!drag)return;const b=drag.snapshot;drag=null;if(moving){commit(b);paintPanel()}render();moving=false;try{scene.releasePointerCapture(e.pointerId)}catch{}}
scene.addEventListener('pointerup',stopDrag);scene.addEventListener('pointercancel',stopDrag);
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.getElementById(e.shiftKey?'redo':'undo').click()}if((e.key==='Delete'||e.key==='Backspace')&&layer(S.selected)){e.preventDefault();update(()=>{S.layers=S.layers.filter(l=>l.id!==S.selected);S.selected=S.layers[0]?.id||null})}});
render();paintPanel();updateUndo();setTimeout(()=>document.querySelector('.stage-tip')?.classList.add('hide'),9000);
})();

</script>
