<!doctype html>
<!-- 咕の返图 1.8.1：八款式按需加载，图片在本机处理。 --><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263f37"><title>咕の返图 · 在线返图制作</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f6f5f0;color:#263f37;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}[hidden]{display:none!important}body{display:flex;flex-direction:column}.studio-bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;padding:9px 18px;background:#263f37;color:#f4efdd;box-shadow:0 2px 12px #13271d20;z-index:5}.identity{font-size:15px;letter-spacing:2px}.identity small{display:block;font-size:9px;letter-spacing:1px;color:#c2cbbd;margin-top:3px}.switch{display:flex;gap:5px;padding:3px;border:1px solid #a8b6a066;background:#ffffff08;border-radius:30px}.switch button{background:transparent;color:#e1e6d9;border:0;font:inherit;font-size:13px;min-height:36px;padding:7px 17px;border-radius:24px;white-space:nowrap;cursor:pointer}.switch button[aria-selected=true]{background:#eee7d3;color:#263f37}.switch button:disabled{opacity:.6;cursor:wait}.switch button:focus-visible{outline:3px solid #cdae78;outline-offset:3px}.studio-area{flex:1;min-height:0;position:relative}.studio-frame{display:block;width:100%;height:100%;border:0;background:#f6f5f0}.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;background:#f6f5f0;color:#637161;pointer-events:none}.save-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;max-width:92%;background:#263f37;color:#fff7e4;border:1px solid #b6c1a6;padding:10px 18px;border-radius:12px;font-size:12px;box-shadow:0 8px 24px #10221833}
@media(max-width:520px){.studio-bar{padding:7px 9px;gap:0;min-height:55px}.identity{display:none}.switch{width:100%;gap:2px;padding:3px}.switch{overflow-x:auto;scrollbar-width:none}.switch button{flex:1 0 auto;min-width:67px;min-height:34px;font-size:11px;padding:6px 7px}.switch::-webkit-scrollbar{display:none}}
</style></head><body><header class="studio-bar"><div class="identity">咕の返图<small>八款式 · 图片在本机处理</small></div><nav class="switch" role="tablist" aria-label="选择返图模板"><button id="tab-fuguang" role="tab" aria-controls="studio-fuguang" aria-selected="true">浮光碎影</button><button id="tab-collage" role="tab" aria-controls="studio-collage" aria-selected="false">散漫ins风</button><button id="tab-guzhe" role="tab" aria-controls="studio-guzhe" aria-selected="false">古风折页</button><button id="tab-stitch" role="tab" aria-controls="studio-stitch" aria-selected="false">缝合艺术</button><button id="tab-sunlit" role="tab" aria-controls="studio-sunlit" aria-selected="false">天气好</button><button id="tab-food" role="tab" aria-controls="studio-food" aria-selected="false">零食小铺</button><button id="tab-magazine" role="tab" aria-controls="studio-magazine" aria-selected="false">旧刊杂志</button><button id="tab-theme" role="tab" aria-controls="studio-theme" aria-selected="false">主题预览</button></nav></header><main class="studio-area"><iframe id="studio-fuguang" class="studio-frame" title="浮光碎影编辑器" aria-labelledby="tab-fuguang" ></iframe><iframe id="studio-collage" class="studio-frame" title="散漫ins风编辑器" aria-labelledby="tab-collage"  hidden></iframe><iframe id="studio-guzhe" class="studio-frame" title="古风折页编辑器" aria-labelledby="tab-guzhe"  hidden></iframe><iframe id="studio-stitch" class="studio-frame" title="缝合艺术编辑器" aria-labelledby="tab-stitch"  hidden></iframe><iframe id="studio-sunlit" class="studio-frame" title="天气好编辑器" aria-labelledby="tab-sunlit"  hidden></iframe><iframe id="studio-food" class="studio-frame" title="零食小铺编辑器" aria-labelledby="tab-food"  hidden></iframe><iframe id="studio-magazine" class="studio-frame" title="旧刊杂志编辑器" aria-labelledby="tab-magazine"  hidden></iframe><iframe id="studio-theme" class="studio-frame" title="主题预览编辑器" aria-labelledby="tab-theme" hidden></iframe><div id="loading" class="loading" role="status"><div style="text-align:center;line-height:2">正在打开返图工作室…<br><a href="fuguang.html" style="pointer-events:auto;color:#355c4c">直接打开浮光碎影 →</a></div></div></main><div class="save-banner" id="saving" role="status" hidden>正在生成或保存，请稍候…</div><script>
'use strict';

const studios=['fuguang','collage','guzhe','stitch','sunlit','food','magazine','theme'],frames=studios.reduce((out,k)=>{out[k]=document.getElementById('studio-'+k);return out;},{});let active='fuguang',busy=false,loadTimer=0;
function showFallback(key){const box=document.getElementById('loading');box.replaceChildren();const wrap=document.createElement('div');wrap.style.cssText='max-width:310px;padding:24px;text-align:center;line-height:1.9';const p=document.createElement('p');p.textContent='编辑器加载较慢，可直接打开当前款式。';const a=document.createElement('a');a.href=key+'.html';a.textContent='直接打开当前款式 →';a.style.cssText='display:block;padding:14px;background:#355c4c;color:white;border-radius:12px;pointer-events:auto';wrap.append(p,a);box.append(wrap);box.hidden=false;}
function tell(frame,data){if(frame.hasAttribute('src'))frame.contentWindow.postMessage(data,location.origin==='null'?'*':location.origin);}
function activate(key){if(!studios.includes(key)||busy)return;active=key;document.getElementById('tab-'+key).scrollIntoView?.({block:'nearest',inline:'center'});for(const k of studios){const frame=frames[k];frame.hidden=k!==key;document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key));if(k===key&&!frame.hasAttribute('src')){document.getElementById('loading').hidden=false;clearTimeout(loadTimer);loadTimer=setTimeout(()=>showFallback(key),20000);frame.src=k+'.html?v=1.8.1';}else tell(frame,{type:'studio-active',active:k===key});}try{localStorage.setItem('fuguang-active-studio',key)}catch{}document.getElementById('loading').hidden=frames[key].dataset.loaded==='yes';}
for(const key of studios){const frame=frames[key];frame.addEventListener('load',()=>{frame.dataset.loaded='yes';if(key===active)clearTimeout(loadTimer);tell(frame,{type:'studio-active',active:key===active});if(key===active)document.getElementById('loading').hidden=true;});document.getElementById('tab-'+key).addEventListener('click',()=>activate(key));}
window.addEventListener('guzheNativeExport',event=>{for(const frame of Object.values(frames))tell(frame,{type:'native-result',detail:event.detail});});
window.addEventListener('message',event=>{if(event.origin!==location.origin||!Object.values(frames).some(f=>f.contentWindow===event.source))return;const message=event.data||{};if(message.type==='studio-busy'){busy=!!message.busy;for(const key of studios)document.getElementById('tab-'+key).disabled=busy;document.getElementById('saving').hidden=!busy;}if(message.type==='font-library-changed')for(const frame of Object.values(frames))if(frame.contentWindow!==event.source)tell(frame,{type:'font-library-changed'});});
try{const previous=localStorage.getItem('fuguang-active-studio');if(studios.includes(previous))active=previous;if(!localStorage.getItem('fuguang-four-styles-migrated')){if(previous==='fuguang')active='collage';localStorage.setItem('fuguang-four-styles-migrated','yes');}}catch{}activate(active);
</script></body></html>
