<!doctype html>
<!-- 咕の返图 1.9.9：九款式按需加载，图片在本机处理。 --><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263f37"><title>咕の返图 · 在线返图制作</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f6f5f0;color:#263f37;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}[hidden]{display:none!important}body{display:flex;flex-direction:column}.studio-bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;padding:9px 18px;background:#263f37;color:#f4efdd;box-shadow:0 2px 12px #13271d20;z-index:5}.identity{font-size:15px;letter-spacing:2px}.identity small{display:block;font-size:9px;letter-spacing:1px;color:#c2cbbd;margin-top:3px}.switch{display:flex;gap:5px;padding:3px;border:1px solid #a8b6a066;background:#ffffff08;border-radius:30px}.switch button{background:transparent;color:#e1e6d9;border:0;font:inherit;font-size:13px;min-height:36px;padding:7px 17px;border-radius:24px;white-space:nowrap;cursor:pointer}.switch button[aria-selected=true]{background:#eee7d3;color:#263f37}.switch button:disabled{opacity:.6;cursor:wait}.switch button:focus-visible{outline:3px solid #cdae78;outline-offset:3px}.studio-area{flex:1;min-height:0;position:relative}.studio-frame{display:block;width:100%;height:100%;border:0;background:#f6f5f0}.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;background:#f6f5f0;color:#637161;pointer-events:none}.save-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;max-width:92%;background:#263f37;color:#fff7e4;border:1px solid #b6c1a6;padding:10px 18px;border-radius:12px;font-size:12px;box-shadow:0 8px 24px #10221833}
@media(max-width:520px){.studio-bar{padding:7px 9px;gap:0;min-height:55px}.identity{display:none}.switch{width:100%;gap:2px;padding:3px}.switch{overflow-x:auto;scrollbar-width:none}.switch button{flex:1 0 auto;min-width:67px;min-height:34px;font-size:11px;padding:6px 7px}.switch::-webkit-scrollbar{display:none}}
.pigeon-loader{width:min(340px,90vw);text-align:center;font:14px system-ui,sans-serif;color:#88818b}.pigeon-loader canvas{display:block;width:100%;height:auto}.pigeon-loader p{margin:0;letter-spacing:2px}@media(prefers-reduced-motion:reduce){.pigeon-loader canvas{opacity:.9}}
</style></head><body><header class="studio-bar"><div class="identity">咕の返图<small>九款式 · 图片在本机处理</small></div><nav class="switch" role="tablist" aria-label="选择返图模板"><button id="tab-fuguang" role="tab" aria-controls="studio-fuguang" aria-selected="true">浮光碎影</button><button id="tab-collage" role="tab" aria-controls="studio-collage" aria-selected="false">散漫ins风</button><button id="tab-guzhe" role="tab" aria-controls="studio-guzhe" aria-selected="false">古风折页</button><button id="tab-stitch" role="tab" aria-controls="studio-stitch" aria-selected="false">缝合艺术</button><button id="tab-sunlit" role="tab" aria-controls="studio-sunlit" aria-selected="false">天气好</button><button id="tab-food" role="tab" aria-controls="studio-food" aria-selected="false">零食小铺</button><button id="tab-magazine" role="tab" aria-controls="studio-magazine" aria-selected="false">旧刊杂志</button><button id="tab-theme" role="tab" aria-controls="studio-theme" aria-selected="false">主题预览专供</button><button id="tab-dark" role="tab" aria-controls="studio-dark" aria-selected="false">信号丢失</button></nav></header><main class="studio-area"><iframe id="studio-fuguang" class="studio-frame" title="浮光碎影编辑器" aria-labelledby="tab-fuguang" ></iframe><iframe id="studio-collage" class="studio-frame" title="散漫ins风编辑器" aria-labelledby="tab-collage"  hidden></iframe><iframe id="studio-guzhe" class="studio-frame" title="古风折页编辑器" aria-labelledby="tab-guzhe"  hidden></iframe><iframe id="studio-stitch" class="studio-frame" title="缝合艺术编辑器" aria-labelledby="tab-stitch"  hidden></iframe><iframe id="studio-sunlit" class="studio-frame" title="天气好编辑器" aria-labelledby="tab-sunlit"  hidden></iframe><iframe id="studio-food" class="studio-frame" title="零食小铺编辑器" aria-labelledby="tab-food"  hidden></iframe><iframe id="studio-magazine" class="studio-frame" title="旧刊杂志编辑器" aria-labelledby="tab-magazine"  hidden></iframe><iframe id="studio-theme" class="studio-frame" title="主题预览专供编辑器" aria-labelledby="tab-theme" hidden></iframe><iframe id="studio-dark" class="studio-frame" title="信号丢失编辑器" aria-labelledby="tab-dark" hidden></iframe><div id="loading" class="loading" role="status"><div class="pigeon-loader" role="status" aria-label="正在加载"><canvas id="pigeon" width="680" height="360" aria-hidden="true"></canvas><p>正在加载 · · ·</p></div></div></main><div class="save-banner" id="saving" role="status" hidden>正在生成或保存，请稍候…</div><script>
'use strict';

const studios=['fuguang','collage','guzhe','stitch','sunlit','food','magazine','theme','dark'],frames=studios.reduce((out,k)=>{out[k]=document.getElementById('studio-'+k);return out;},{});let active='fuguang',busy=false,loadTimer=0;
function showFallback(key){const box=document.getElementById('loading');box.querySelector('.loader-fallback')?.remove();const wrap=document.createElement('div');wrap.className='loader-fallback';wrap.style.cssText='max-width:310px;padding:24px;text-align:center;line-height:1.9';const p=document.createElement('p');p.textContent='编辑器加载较慢，可直接打开当前款式。';const a=document.createElement('a');a.href=key+'.html';a.textContent='直接打开当前款式 →';a.style.cssText='display:block;padding:14px;background:#355c4c;color:white;border-radius:12px;pointer-events:auto';wrap.append(p,a);box.append(wrap);box.hidden=false;}
function tell(frame,data){if(frame.hasAttribute('src'))frame.contentWindow.postMessage(data,location.origin==='null'?'*':location.origin);}
function activate(key){if(!studios.includes(key)||busy)return;active=key;document.getElementById('tab-'+key).scrollIntoView?.({block:'nearest',inline:'center'});for(const k of studios){const frame=frames[k];frame.hidden=k!==key;document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key));if(k===key&&!frame.hasAttribute('src')){document.querySelector('.loader-fallback')?.remove();document.getElementById('loading').hidden=false;clearTimeout(loadTimer);loadTimer=setTimeout(()=>showFallback(key),20000);frame.src=k+'.html?v=1.10.1';}else tell(frame,{type:'studio-active',active:k===key});}try{localStorage.setItem('fuguang-active-studio',key)}catch{}document.getElementById('loading').hidden=frames[key].dataset.loaded==='yes';}
for(const key of studios){const frame=frames[key];frame.addEventListener('load',()=>{frame.dataset.loaded='yes';if(key===active)clearTimeout(loadTimer);tell(frame,{type:'studio-active',active:key===active});if(key===active)document.getElementById('loading').hidden=true;});document.getElementById('tab-'+key).addEventListener('click',()=>activate(key));}
window.addEventListener('guzheNativeExport',event=>{for(const frame of Object.values(frames))tell(frame,{type:'native-result',detail:event.detail});});
window.addEventListener('message',event=>{if(event.origin!==location.origin||!Object.values(frames).some(f=>f.contentWindow===event.source))return;const message=event.data||{};if(message.type==='studio-busy'){busy=!!message.busy;for(const key of studios)document.getElementById('tab-'+key).disabled=busy;document.getElementById('saving').hidden=!busy;}if(message.type==='font-library-changed')for(const frame of Object.values(frames))if(frame.contentWindow!==event.source)tell(frame,{type:'font-library-changed'});});
try{const previous=localStorage.getItem('fuguang-active-studio');if(studios.includes(previous))active=previous;if(!localStorage.getItem('fuguang-four-styles-migrated')){if(previous==='fuguang')active='collage';localStorage.setItem('fuguang-four-styles-migrated','yes');}}catch{}activate(active);
</script><script>
(()=>{const c=document.getElementById('pigeon'),ctx=c.getContext('2d');let frame=0,prints=[],last=0;const fps=24,dt=1000/fps;function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}function foot(x,y,rot,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;line([[0,6],[0,-4]],'#b59aa0',3.4);line([[0,-4],[-8,-10]],'#b59aa0',3.4);line([[0,-4],[0,-13]],'#b59aa0',3.4);line([[0,-4],[8,-10]],'#b59aa0',3.4);ctx.restore()}function draw(){ctx.clearRect(0,0,680,360);const t=frame/24,phase=t*7.5;const x=340+Math.sin(t*.75)*104;const dir=Math.cos(t*.75)>=0?1:-1;const bob=Math.abs(Math.sin(phase))*5;const ground=264;ellipse(x,ground+4,88,10,'rgba(91,79,89,.07)');for(const p of prints){foot(p.x,p.y,p.rot,Math.max(0,1-(frame-p.birth)/95)*.45)}prints=prints.filter(p=>frame-p.birth<95);if(frame%10===0)prints.push({x:x-dir*36,y:ground+5+(frame%20?3:-3),rot:dir*.25,birth:frame});ctx.save();ctx.translate(x,ground-74-bob);ctx.scale(dir,1); // pigeon
// tail
ellipse(-75,20,34,16,'#858092');ellipse(-81,12,27,11,'#9d98aa');
// body
ellipse(0,10,79,64,'#e7e4eb');ellipse(16,20,59,48,'#f8f7f6');
// neck and head
ellipse(44,-36,40,45,'#c7c1d1');ellipse(51,-51,35,34,'#e3dfe7');ellipse(38,-21,24,21,'#b5c8bf');
// wing
ellipse(-26,18,45,32,'#f7f5f6');ellipse(-47,24,21,16,'#d4d0db');line([[-65,23],[-51,35],[-38,40]],'#8e899d',5);line([[-55,12],[-41,26],[-27,31]],'#a19bad',5);
// cheek eye beak
ellipse(62,-41,9,7,'#edb4b5');ellipse(66,-61,4.6,5,'#342f39');ellipse(82,-44,12,6,'#dc9a80');
// leaf stem
line([[88,-45],[121,-58]],'#789765',3);ctx.save();ctx.translate(107,-59);ctx.rotate(-.35+Math.sin(t*4)*.08);ellipse(0,-8,12,6,'#95b874');ellipse(13,4,11,6,'#8eae6d');ctx.restore();
// feet animated stepping
const a=Math.sin(phase),b=Math.sin(phase+Math.PI);for(const [offset,s] of [[-29,a],[28,b]]){let lift=Math.max(0,s)*14;line([[offset,64],[offset+10*s,80-lift]],'#c47d7f',5);line([[offset+10*s,80-lift],[offset+23*s+7,83-lift]],'#c47d7f',5);line([[offset+10*s,80-lift],[offset+23*s-4,87-lift]],'#c47d7f',4)}ctx.restore();frame++}function loop(now){if(!document.hidden&&!document.getElementById('loading').hidden&&now-last>=dt){draw();last=now}requestAnimationFrame(loop)}if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw()}else requestAnimationFrame(loop)})();
</script></body></html>
