.footer{display:grid;grid-template-columns:13.3% minmax(0,1fr);align-items:center;margin-top:1.65cqw;position:relative}.footer-sticker{width:76%;margin:auto}.search{display:flex;min-width:0;align-items:stretch;min-height:6.4cqw;border:1px solid #a6a397;border-radius:.9cqw;background:linear-gradient(#fbfbf9,#fff 58%,#efefed);box-shadow:inset 0 .18cqw .22cqw #74746b2d,0 .14cqw 0 #fff9;overflow:hidden}.search-label{flex:0 0 34%;display:flex;align-items:center;min-width:0;padding:.35cqw .9cqw;gap:.6cqw;background:linear-gradient(#fff 0%,#f6f6f3 42%,#dededb 100%);border-right:1px solid #b3b0a5;box-shadow:inset 0 -.2cqw .3cqw #fff;align-self:stretch}.search-label svg{width:5.4cqw;flex:none}.search-label span{font-family:FrameUI,'Malgun Gothic','NanumGothic',sans-serif;font-size:3.25cqw;white-space:nowrap;letter-spacing:-.1cqw;color:#272925}.down{margin-left:auto;width:0;height:0;border-left:.8cqw solid transparent;border-right:.8cqw solid transparent;border-top:.7cqw solid #85867d;filter:drop-shadow(0 1px #fff)}.search-field{min-width:0;flex:1;display:flex;align-items:center;padding:.6cqw 1.1cqw;gap:.85cqw}.caption{flex:1;min-width:0;color:var(--caption-color);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:.22cqw}.caption[hidden],.caption [hidden]{display:none!important}.caption-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:.15cqw .9cqw;min-width:0}.caption h2{font-size:var(--title-size);font-weight:700;line-height:1.12;margin:0;overflow-wrap:anywhere;min-width:0;max-width:100%}.caption p{margin:0;font-size:var(--desc-size);line-height:1.3;overflow-wrap:anywhere;white-space:normal}#theme-author{font-size:var(--author-size);opacity:.83;line-height:1.14}#theme-description{text-align:left}.go{flex:none;font-family:FrameUI,Arial,sans-serif;font-weight:bold;letter-spacing:.06em;font-size:2.2cqw;color:#383a35;border:1px solid #9a9b91;border-radius:.4cqw;background:linear-gradient(#fff,#dcddda);box-shadow:inset 0 0 0 .15cqw #fff,0 .1 /* Vintage printed paper and restrained molded-plastic sheen. Screens remain untouched. */
.poster{--light:#e8f7d7;--dark:#8cbe52;--edge:#bacb8a;--panel:#f0f6db;--mount:#e5f0d3;--gap:2px;--zoom:1;--screen-x:50%;--screen-y:50%;border-color:var(--edge)}
.client{border-color:var(--edge);background:linear-gradient(145deg,var(--light),var(--shell) 38%,var(--shell))}
.rail{background:linear-gradient(90deg,#ffffff8c,var(--light))}
.screen-row{gap:2px}.shot img{transform:none;object-position:center}
.description-panel{display:flex;align-items:flex-start;gap:1cqw;margin:.9cqw 0 0 13.3%;padding:1.05cqw 1.3cqw;min-width:0;border:1px solid var(--edge);border-radius:.7cqw;background:linear-gradient(180deg,#fff,var(--panel));color:var(--caption-color);box-shadow:inset 0 .15cqw .28cqw #67704913}
.description-panel[hidden]{display:none!important}.description-badge{width:1.8cqw;flex:none;margin-top:.2cqw}.description-badge svg{width:100%;height:auto}.description-panel p{margin:0;min-width:0;flex:1;font-size:var(--desc-size);line-height:1.48;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.poster[data-extras="false"] .description-badge{display:none}

/* Fine printed stock, no texture or reflections covering uploaded screenshots. */
.poster{border-radius:.65cqw;box-shadow:inset 0 0 0 .12cqw #fff9}
.client{background:repeating-linear-gradient(0deg,#6f765403 0px,#6f765403 .55px,transparent .9px,transparent 3.3px),linear-gradient(160deg,var(--panel),var(--shell) 25%,var(--shell));box-shadow:inset 0 0 0 .18cqw #fff9;border-color:var(--edge)}

iv class="search-label"><svg viewBox="0 0 82 80" aria-hidden="true"><use href="#magnify" filter="url(#soft)"/></svg><span>통합검색</span><i class="down"></i></div><div class="search-field"><svg class="field-star deco" viewBox="0 0 26 26" aria-hidden="true"><use href="#spark"/></svg><div class="caption" id="caption" hidden><div class="caption-heading"><h2 id="theme-title"></h2><p id="theme-author"></p></div></div><span class="go">GO</span></div></div></div><div id="description-panel" class="description-panel" hidden><span class="description-badge" aria-hidden="true"><svg viewBox="0 0 26 26"><use href="#spark"/></svg></span><p id="theme-description"></p></div></div></main></div></div><p class="gu-meta">纸感外壳、完整截图、摇摇熊熊。简介自动撑高。</p></section><section class="gu-panel"><nav id="gu-tabs" class="gu-tabs" aria-label="编辑分区"></nav><div class="gu-box"><h2>截图 · SCREENSHOTS</h2><button id="gu-batch" type="button">一次上传 1–3 张截图</button><input id="gu-batch-file" type="file" accept="image/*" multiple hidden><div class="gu-file-grid" id="gu-files"></div><p class="gu-meta">按首页、阅读、书架的顺序上传，也可以单独替换。</p></div><div class="gu-box"><h2>主题信息</h2><label>主题名称<input class="gu-input" type="text" id="gu-title" maxlength="120" value="古早绿色emoji"></label><label>制作者<input class="gu-input" type="text" id="gu-author" maxlength="80" placeholder="作者名称"></label><label>简介<textarea class="gu-input" id="gu-description" maxlength="1500"></textarea></label><div class="gu-row"><span>主题文字字体</span><select id="gu-font"><option value="system-ui">系统默认</option><option value="serif">衬线字体</option><option value="sans-serif">无衬线字体</option><option value="monospace">等宽字体</option></select></div><div class="gu-actions"><button type="button" id="gu-font-pick">上传字体</button><input type="file" id="gu-font-file" accept=".ttf,.otf,.woff,.woff2" hidden><span id="gu-font-status" class="gu-meta"></span></div><p class="gu-meta">韩文菜单保持固定字形，主题信息可独立换字体。</p></div><div id="gu-settings"></div><div class="gu-box" id="gu-export-box"><h2>导出设置</h2><label class="gu-row"><span>输出宽度</span><select id="gu-resolution"><option value="900">900 px</option><option value="1350">1350 px</option><option value="1800" selected>1800 px</option><option value="2700">2700 px</option></select></label><label class="gu-row"><span>GIF 宽度</span><select id="gu-gif-size"><option value="600">600 px · 小体积</option><option value="900" selected>900 px · 推荐</option><option value="1200">1200 px · 高清</option></select></label><label class="gu-row"><span>GIF 帧率</span><select id="gu-gif-fps"><option value="8">8 fps</option><option value="10" selected>10 fps</option><option value="15">15 fps</option></select></label><progress id="gu-progress" max="100" value="0" hidden></progress><div class="gu-actions"><button type="button" class="gu-primary" id="gu-export">静图 PNG</button><button type="button" class="gu-primary" id="gu-gif-export">动态 GIF</button><button type="button" id="gu-cancel" hidden>取消生成</button><button type="button" id="gu-reset">恢复默认参数</button></div><p id="gu-status" role="status" class="gu-meta">上传截图后即可生成图片。</p><div id="gu-results" class="gu-results"></div></div></section></div><script>const CONFIG={accent:'#b6e581',shell:'#f8f8ec',count:3};
(()=>{
'use strict';
const poster=document.getElementById('poster'),row=document.getElementById('screen-row');
const slots=JSON.parse(document.querySelector('meta[name="reeden-template-screens"]').content);
const get=(o,n,d)=>o?.[n]??o?.['param.'+n]??o?.param?.[n]??d;
const flag=(o,n,d)=>[true,'true','1',1,'on','yes'].includes(typeof get(o,n,d)==='string'?get(o,n,d).trim().toLowerCase():get(o,n,d));
const number=(o,n,d,min,max)=>{const z=Number(get(o,n,d));return Math.min(max,Math.max(min,Number.isFinite(z)?z:d))};
const clean=v=>v==null?'':String(v).trim();
// Reeden/Flutter color controls return #AARRGGBB, not CSS #RRGGBBAA.
function hex(val,def){
 if(val&&typeof val==='object')val=val.value??val.color??val.hex;
 if(typeof val==='number'&&Number.isFinite(val))return '#'+(val>>>0).toString(16).padStart(8,'0').slice(-6);
 let v=clean(val);if(/^0x[\da-f]{8}$/i.test(v))v='#'+v.slice(2);
 if(/^#[\da-f]{8}$/i.test(v))return '#'+v.slice(3).toLowerCase();
 if(/^#[\da-f]{6}$/i.test(v))return v.toLowerCase();
 if(/^#[\da-f]{3}$/i.test(v))return '#'+v.slice(1).split('').map(c=>c+c).join('').toLowerCase();
 return def;
}
const rgb=h=>{if(/^#[\da-f]{3}$/i.test(h))h='#'+h.slice(1).split('').map(c=>c+c).join('');return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));};
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const blend=(a,b,t)=>toHex(rgb(a).map((v,i)=>v*(1-t)+rgb(b)[i]*t));
function hsl(h){let [r,g,b]=rgb(h).map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2,H=0,S=d?d/(1-Math.abs(2*l-1)):0;if(d){H=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;}return [H*60,S,l];}
function fromHsl(h,s,l){h=((h%360)+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let a=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return toHex(a.map(v=>(v+m)*255));}
// Store original vector colors once: each render starts from original pigments.
const greenPaint=[];
for(const el of poster.querySelectorAll('svg [fill],svg [stroke],svg [stop-color],svg [flood-color]')){
 for(const attr of ['fill','stroke','stop-color','flood-color']){
  const v=el.getAttribute(attr);if(!v||!/^#[a-f0-9]{6}$/i.test(v))continue;
  const [h,s,l]=hsl(v);if(h>=61&&h<=150&&s>.17&&l>.12)greenPaint.push([el,attr,v]);
 }
}
function recolor(accent,shell){
 const base=hsl(CONFIG.accent),target=hsl(accent),delta=target[0]-base[0];
 const original=accent.toLowerCase()===CONFIG.accent;
 for(const [el,attr,v] of greenPaint){const [h,s,l]=hsl(v);el.setAttribute(attr,original?v:fromHsl(h+delta,Math.min(.95,s*Math.min(1.5,target[1]/base[1])),l));}
 const p={accent,shell,light:blend(accent,'#ffffff',.69),dark:blend(accent,'#303030',.24),edge:blend(accent,'#737373',.31),panel:blend(shell,accent,.22),mount:blend(shell,accent,.36)};
 for(const [k,v] of Object.entries(p))poster.style.setProperty('--'+k,v);
 const grad=(id,colors)=>document.querySelectorAll('#'+id+' stop').forEach((x,i)=>x.setAttribute('stop-color',colors[i]));
 grad('topbar',[blend(accent,'#f9f4df',.56),blend(accent,'#9fae80',.23),blend(accent,'#f1edda',.12),blend(accent,'#fff9e7',.47),blend(accent,'#f8f5e2',.70)]);
 grad('strip',[blend(accent,'#fbfae7',.75),blend(shell,accent,.13),blend(shell,'#fffdf1',.42)]);
}
const firstText=(...values)=>values.map(x=>typeof x==='string'||typeof x==='number'?clean(x):'').find(Boolean)||'';
const mock={type:'themePreview',theme:{name:'墨竹',author:'Reeden',description:'把首页、阅读页和书架存进青柠色的好友窗口。'} ,screens:slots.map(s=>({...s,image:null}))};
window.ReedenShareTemplateMock=mock;
function placeholder(i){
 const d=document.createElement('div');d.className='placeholder';
 const palettes=[['#e0e4df','#acbdb4'],['#efe8e2','#b7b3aa'],['#e4e0e8','#aaa6ba']];
 d.style.background=`linear-gradient(150deg,${palettes[i][0]},#f8f6ed)`;
 d.innerHTML='<div class="top">9:41　• • •</div><div class="brand">REEDEN</div><div class="art">✦</div><div class="mini">A LITTLE LIBRARY</div><div class="lines"></div><div class="bottom">⌂　　 ♡　　 ☾</div>';
 return d;
}
function makeShot(screen,i,isDemo){const d=document.createElement('div');d.className='shot';const src=clean(screen?.image);
 if(src){const bg=document.createElement('img');bg.className='shot-bg';bg.src=src;bg.alt='';d.append(bg);
 const img=document.createElement('img');img.alt=clean(screen.label)||'Reeden '+(i+1);img.onload=()=>{if(img.naturalWidth&&img.naturalHeight){d.style.setProperty('--phone-ratio',img.naturalWidth+' / '+img.naturalHeight);window.Reeden?.resize?.()}};img.src=src;img.decoding='async';img.loading='eager';img.onerror=()=>{d.textContent='截图加载失败'};d.append(img)
 }else if(isDemo){d.append(placeholder(i))}else{d.append(placeholder(i))}return d;}
window.ReedenShareTemplate={render(payload={}){
 const params=payload.params||{},appearance=payload.appearance||{},theme=payload.theme||{};
 const incoming=Array.isArray(payload.screens)?payload.screens:[];
 const count=Math.round(number(params,'screenCount',CONFIG.count,1,3));
 const primary=Math.round(number(params,'mainScreen',0,0,2));
 const indices=count===1?[primary]:Array.from({length:count},(_,i)=>i);
 const isDemo=payload===mock||(!incoming.some(s=>clean(s?.image))&&!window.__REEDEN_SHARE_PAYLOAD__);
 row.dataset.count=String(count);
 row.dataset.fit=get(params,'screenFit','contain')==='cover'?'cover':'contain';
 row.dataset.backdrop=get(params,'screenBackdrop','blur')==='solid'?'solid':'blur';
 const sig=JSON.stringify([indices,incoming.map(s=>[s?.id,s?.page,s?.image])]);if(row.dataset.sig!==sig){row.dataset.sig=sig;row.replaceChildren();
 for(const i of indices){const slot=slots[i];const item=incoming.find(s=>s?.id===slot.id)||incoming.find(s=>s?.page===slot.page)||incoming[i]||{};row.append(makeShot(item,i,isDemo));}}
 recolor(hex(get(params,'accentColor',CONFIG.accent),CONFIG.accent),hex(get(params,'shellColor',CONFIG.shell),CONFIG.shell));
 poster.style.setProperty('--heart',hex(get(params,'heartColor','#dda9bf'),'#dda9bf'));
 poster.style.setProperty('--metal',hex(get(params,'metalColor','#b7bbbf'),'#b7bbbf'));
 poster.style.setProperty('--pearl',hex(get(params,'pearlColor','#a98bd3'),'#a98bd3'));
 poster.style.setProperty('--rim',hex(get(params,'rimColor','#39363c'),'#39363c'));
 poster.dataset.extras=String(flag(params,'showDecorations',true));
 poster.dataset.icons=String(flag(params,'showIcons',true));
 poster.dataset.glass=String(flag(params,'showGlass',false));
 const title=document.getElementById('theme-title'),author=document.getElementById('theme-author'),desc=document.getElementById('theme-description');
 title.textContent=firstText(theme.name,theme.title,payload.themeName);author.textContent=firstText(theme.author,theme.creator,payload.themeAuthor);
 const description=firstText(get(params,'customDescription',''),theme.description,theme.desc,theme.intro,theme.summary,payload.themeDescription,payload.description);
 desc.textContent=flag(params,'showDescription',true)?description:'';
 document.getElementById('description-panel').hidden=!desc.textContent;
 title.hidden=!title.textContent;author.hidden=!author.textContent;desc.hidden=!desc.textContent;
 const caption=document.getElementById('caption');caption.hidden=!flag(params,'showCaption',true)||(!title.textContent&&!author.textContent);
 poster.dataset.caption=String(!caption.hidden);
 poster.style.setProperty('--title-size',number(params,'titleSize',34,18,54)/12.43+'cqw');
 poster.style.setProperty('--author-size',number(params,'authorSize',22,12,38)/12.43+'cqw');
 poster.style.setProperty('--desc-size',number(params,'descriptionSize',21,12,34)/12.43+'cqw');
 poster.style.setProperty('--caption-color',hex(get(params,'captionColor','#30451d'),'#30451d'));
 if(clean(appearance.fontFamily))poster.style.setProperty('--user-font',JSON.stringify(clean(appearance.fontFamily)));else poster.style.removeProperty('--user-font');
