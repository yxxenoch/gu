<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fb5ae">
<meta name="description" content="咕的小岛：一座座漂在海上的小房子，每间都是一个返图小工具。推开房门，开始创作。">
<title>咕的小岛 · 咕の返图</title>
<style>
:root{--ink:#31514a;--deep:#274742;--tag:#fdf9ec;--line:#e4dcc8;--accent:#c97f6a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);background:#a7c9c3}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid #e8c98f;outline-offset:2px}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;
 background:linear-gradient(180deg,#f4e7cf 0%,#eddcc0 26%,#cfe0d8 40%,#a9cdc5 62%,#86b3ab 100%)}
#viewport:before{content:"";position:absolute;left:0;right:0;top:0;height:40%;pointer-events:none;
 background:radial-gradient(circle at 78% 20%,#fff6dd 0 6.5%,#ffe9b355 7%,transparent 16%)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.sea-ring{position:absolute;border-radius:50%;pointer-events:none;opacity:.5;
 background:radial-gradient(ellipse at center,transparent 58%,#ffffff22 62%,transparent 70%)}
.cloud{position:absolute;pointer-events:none;opacity:.85;animation:drift linear infinite}
.cloud i{position:absolute;background:#fbf6ea;border-radius:50px;box-shadow:inset -4px -6px 0 #eee2cc}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(115vw)}}
.wave{position:absolute;pointer-events:none;border-top:2px dashed #ffffff2e;border-radius:50%;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.region{position:absolute;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#3c6b60}
.region b{display:block;font:600 22px/1.4 "Songti SC","Noto Serif SC",serif;letter-spacing:.35em;text-indent:.35em;opacity:.8}
.region small{font:10px Georgia,serif;letter-spacing:.3em;opacity:.55}
.isle{position:absolute;transform:translate(-50%,-50%);width:150px;display:block;text-decoration:none;color:inherit;cursor:pointer}
.isle .bob{animation:bob 5.5s ease-in-out infinite;transform-origin:50% 70%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.6deg)}}
.isle .shadow{position:absolute;left:50%;top:calc(100% - 12px);width:120px;height:22px;transform:translateX(-50%);border-radius:50%;background:#3d6b6333;filter:blur(3px);animation:shrink 5.5s ease-in-out infinite}
@keyframes shrink{0%,100%{transform:translateX(-50%) scale(1);opacity:.8}50%{transform:translateX(-50%) scale(.86);opacity:.5}}
.land{position:relative;display:block}
.mound{display:block;height:34px;border-radius:50% 50% 46% 46%/62% 62% 40% 40%;background:linear-gradient(180deg,#cfe0b4,#a9c48c 62%,#8fae78);box-shadow:inset 0 6px 0 #e7f0d2,inset 0 -8px 0 #7d9c6a}
.base{display:block;margin:-6px 8px 0;height:40px;border-radius:0 0 46% 46%/0 0 100% 100%;background:linear-gradient(180deg,#c9a684,#a8815f 55%,#8a6847);clip-path:polygon(4% 0,96% 0,82% 78%,60% 100%,40% 100%,18% 78%);box-shadow:inset 0 6px 0 #b08f6d}
.deco{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:84px;height:66px;display:grid;place-items:end center;pointer-events:none}
.deco svg{width:100%;height:100%;overflow:visible}
.tag{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);white-space:nowrap;background:var(--tag);border:1px solid #d9cfa8;border-radius:20px;padding:4px 12px;font-size:11px;letter-spacing:.08em;color:#5a5140;box-shadow:0 3px 8px #2b524a26;transition:transform .2s}
.isle:hover .tag,.isle:focus-visible .tag{transform:translate(-50%,2px);background:#fffef7}
.isle.new .tag{border-color:#e4b98c;color:#a05a3e;font-weight:600}
.isle.new .tag:after{content:" · 新"}
.isle.sel .bob{animation-play-state:paused}
.isle.sel .land .mound{filter:brightness(1.06)}
.boat{position:absolute;width:96px;pointer-events:none;animation:sail 80s linear infinite}
@keyframes sail{from{transform:translateX(-15vw)}to{transform:translateX(118vw)}}
.gull{position:absolute;pointer-events:none;animation:gull 46s linear infinite}
@keyframes gull{from{transform:translate(110vw,0)}to{transform:translate(-16vw,-6vh)}}
/* HUD */
.hud{position:fixed;z-index:40;display:flex;gap:8px;align-items:center}
.hud.top{top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;justify-content:space-between;pointer-events:none}
.hud.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:#fdf9ecdb;border:1px solid #e0d4b0;border-radius:16px;padding:8px 14px 8px 10px;backdrop-filter:blur(6px);box-shadow:0 6px 18px #2f5b5330}
.brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#31514a;color:#f4ead0;font:17px "Songti SC",serif}
.brand b{font:600 15px "Songti SC","Noto Serif SC",serif;letter-spacing:.1em;color:var(--deep)}
.brand small{display:block;font-size:9px;letter-spacing:.16em;color:#7a8b7f;margin-top:1px}
.hud .tools{display:flex;gap:8px}
.hbtn{min-height:40px;padding:8px 13px;border-radius:12px;border:1px solid #e0d4b0;background:#fdf9ecdb;color:var(--deep);font-size:12px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 6px 18px #2f5b5330;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{background:#fffef7}
.zoom{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:grid;gap:7px}
.zoom .hbtn{min-width:42px;min-height:42px;justify-content:center;font-size:15px;padding:8px}
.hint-pill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;background:#274742c9;color:#f4ecd8;border-radius:30px;padding:9px 17px;font-size:12px;letter-spacing:.06em;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
/* popover card */
.card-pop{position:fixed;z-index:50;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(400px,calc(100vw - 28px));background:#fdfaf0;border:1px solid #ddcfab;border-radius:18px;box-shadow:0 20px 50px #1f423b45;padding:15px 16px 14px;display:none}
.card-pop.show{display:block;animation:pop .22s ease}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.card-pop h2{margin:0;font:600 17px "Songti SC","Noto Serif SC",serif;letter-spacing:.08em;color:var(--deep)}
.card-pop p{margin:4px 0 12px;font-size:12px;color:#75816f}
.card-pop .row{display:flex;gap:8px}
.card-pop .go{flex:1;background:#31514a;color:#f6efdb;border:0;border-radius:11px;min-height:42px;font-size:13px;font-weight:600;cursor:pointer}
.card-pop .go:hover{background:#3c6158}
.card-pop .close{background:#efe9d5;border:0;border-radius:11px;min-width:46px;cursor:pointer;color:#6b6a58}
.card-pop .flag{font:9px Georgia,serif;letter-spacing:.2em;color:#a08c5f}
/* catalog sheet */
.sheet{position:fixed;inset:0;z-index:60;background:#1d3a35a8;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet-box{background:#faf6ea;width:min(560px,100%);max-height:82dvh;border-radius:22px 22px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;box-shadow:0 -18px 60px #12302b66}
.sheet-box h2{margin:0 0 4px;font:600 18px "Songti SC",serif;color:var(--deep);letter-spacing:.1em}
.sheet-box>p{margin:0 0 14px;font-size:11px;color:#8b947f}
.sheet h3{font-size:12px;color:#9c8c62;margin:16px 0 8px;letter-spacing:.15em}
.sheet .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sheet .links a{display:block;text-decoration:none;background:#fffdf5;border:1px solid #e3d8ba;border-radius:12px;padding:10px 10px 8px;color:var(--ink)}
.sheet .links a b{display:block;font-size:12.5px}
.sheet .links a small{font-size:10px;color:#8b947f}
.sheet .links a[href="islands.html"],.sheet .links a.new{border-color:#e4b98c;background:#fdf4e4}
.sheet .dismiss{width:100%;margin-top:16px;min-height:44px;border:1px solid #ddd0ae;border-radius:12px;background:#f0e9d4;color:#6b6247;cursor:pointer}
@media(max-width:640px){.brand small{display:none}.brand b{font-size:13px}.hbtn{padding:8px 10px;font-size:11px}.region b{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

</div>
<div class="sheet" id="sheet"><div class="sheet-box">

</div></div>

/* 灯塔小景（独占画法，比普通岛高） */
const LIGHT_DECO=`<svg viewBox="0 0 84 96"><path d="M30 88L35 30h14l5 58z" fill="#f2e7cd" stroke="${WOOD}" stroke-width="2.6"/><path d="M33 66h18M34.5 52h15M36 38h12" stroke="#c98a6d" stroke-width="4"/><rect x="33" y="18" width="18" height="12" rx="3" fill="#3d5a52"/><path d="M31 18h22l-4-8H35z" fill="#b96f5e"/><circle cx="42" cy="24" r="3" fill="#f6e3a0"/><path d="M14 22q10-6 20-3M50 19q10-3 20 3" stroke="#f6e3a0" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".8"/></svg>`;
/* ————— 渲染世界 ————— */
const world=document.getElementById('world'),vp=document.getElementById('viewport');
world.style.width=WORLD.w+'px';world.style.height=WORLD.h+'px';
const frag=document.createDocumentFragment();
for(const r of REGIONS){const el=document.createElement('div');el.className='region';el.style.left=r.x+'px';el.style.top=r.y+'px';el.innerHTML='<b>'+r.name+'</b><small>'+r.en+'</small>';frag.append(el);}
/* 水纹 */
for(let i=0;i<16;i++){const w=document.createElement('i');w.className='wave';const x=Math.random()*WORLD.w,y=520+Math.random()*(WORLD.h-560);w.style.cssText=`left:${x}px;top:${y}px;width:${60+Math.random()*90}px;height:${16+Math.random()*14}px;animation-delay:${-Math.random()*7}s`;frag.append(w);}
/* 云 */
for(let i=0;i<6;i++){const c=document.createElement('span');c.className='cloud';const s=.7+Math.random()*.9,y=40+Math.random()*300,dur=90+Math.random()*80;
 c.style.cssText=`top:${y}px;animation-duration:${dur}s;animation-delay:${-Math.random()*dur}s;transform:scale(${s})`;
 c.innerHTML='<i style="width:90px;height:26px"></i><i style="left:16px;top:-13px;width:44px;height:34px"></i><i style="left:44px;top:-8px;width:38px;height:28px"></i>';frag.append(c);}
function isleNode(it){const a=document.createElement('a');a.className='isle'+(it.fresh?' new':'');a.href=encodeURIComponent(it.id)+'.html';a.dataset.id=it.id;
 a.style.left=it.x+'px';a.style.top=it.y+'px';
 const bob=document.createElement('span');bob.className='bob';bob.style.animationDelay=(-Math.random()*6)+'s';
 const land=document.createElement('span');land.className='land';land.style.transform=`scale(${it.s||1})`;land.style.transformOrigin='50% 100%';
 land.innerHTML='<span class="deco">'+(DECO[it.d]||DECO.cottage)+'</span><span class="mound"></span><span class="base"></span>';
 const sh=document.createElement('span');sh.className='shadow';sh.style.animationDelay=bob.style.animationDelay;
 bob.append(land);a.append(bob,sh);
 const tag=document.createElement('span');tag.className='tag';tag.textContent=it.name;a.append(tag);
 a.addEventListener('click',e=>{e.preventDefault();select(it,a)});return a;}
for(const it of ISLES)frag.append(isleNode(it));
/* 灯塔岛 */
const lh=document.createElement('a');lh.className='isle';lh.href='./index.html';lh.dataset.id='index';lh.style.left=LIGHT.x+'px';lh.style.top=LIGHT.y+'px';lh.setAttribute('aria-label','返图画册 · 全部模板');
{const bob=document.createElement('span');bob.className='bob';const land=document.createElement('span');land.className='land';
 land.innerHTML='<span class="deco" style="width:96px;height:96px;bottom:24px">'+LIGHT_DECO+'</span><span class="mound"></span><span class="base"></span>';
 const sh=document.createElement('span');sh.className='shadow';bob.append(land);lh.append(bob,sh);
 const tag=document.createElement('span');tag.className='tag';tag.textContent=LIGHT.name;lh.append(tag);
 lh.addEventListener('click',e=>{e.preventDefault();select(LIGHT,lh)});frag.append(lh);}
/* 海鸥与纸船 */
const g=document.createElement('span');g.className='gull';g.style.top='140px';g.innerHTML='<svg width="60" height="26" viewBox="0 0 60 26"><path d="M4 14q11-12 22-2M26 12q4-6 8 0M34 12q11-10 22-2" stroke="#5d7a72" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';frag.append(g);
const bt=document.createElement('span');bt.className='boat';bt.style.top='1080px';bt.innerHTML='<svg width="96" height="46" viewBox="0 0 96 46"><path d="M12 26h72l-10 14H24z" fill="#c99a67"/><path d="M48 4v22" stroke="#8a6847" stroke-width="3"/><path d="M48 6l-22 20h22z" fill="#f2e7cd"/><path d="M50 10l16 16h-16z" fill="#e8d9b8"/></svg>';frag.append(bt);
world.append(frag);
/* ————— 平移 / 缩放 ————— */
let scale=.6,tx=0,ty=0;const pts=new Map();let moved=false,downAt=0,pinch0=0,scale0=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function bounds(){const r=vp.getBoundingClientRect();tx=clamp(tx,Math.min(0,r.width-WORLD.w*scale-40),40);ty=clamp(ty,Math.min(0,r.height-WORLD.h*scale-40),40);}
function fit(){const r=vp.getBoundingClientRect();scale=clamp(Math.min(r.width/WORLD.w,(r.height-70)/WORLD.h)*1.06,.3,1.15);
 tx=(r.width-WORLD.w*scale)/2;ty=(r.height-WORLD.h*scale)/2+10;bounds();apply();}
function zoomAt(cx,cy,f){const ns=clamp(scale*f,.28,2.4);tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;bounds();apply();}
vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;downAt=performance.now();if(pts.size===2){const [p,q]=[...pts.values()];pinch0=Math.hypot(p.x-q.x,p.y-q.y);scale0=scale;}});
vp.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(pts.size===1){tx+=dx;ty+=dy;if(Math.hypot(dx,dy)>3)moved=true;bounds();apply();}
 else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,scale0*(d/pinch0)/scale);}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=0;
 if(performance.now()-downAt<300&&!moved){const el=document.elementFromPoint(e.clientX,e.clientY),isle=el&&el.closest('.isle');
  if(isle){const it=byId[isle.dataset.id||'index'];select(it,isle);return}
  if(el&&!el.closest('.hbtn,.card-pop,.sheet-box'))hidePop();}};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.9)},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.25);
document.getElementById('zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,.8);
document.getElementById('zfit').onclick=fit;
addEventListener('resize',()=>{bounds();apply()});
/* ————— 弹卡 ————— */
const pop=document.getElementById('pop');let selEl=null;
function select(it,a){document.querySelectorAll('.isle.sel').forEach(x=>x.classList.remove('sel'));a.classList.add('sel');selEl=a;
 document.getElementById('pop-name').textContent=it.name;
 document.getElementById('pop-sub').textContent=(it.sub||'');
 document.getElementById('pop-flag').textContent=it.fresh?'NEW ROOM · 新房间':(it.id==='index'?'LIGHTHOUSE · 灯塔':'GU STUDIO');
 document.getElementById('pop-go').onclick=()=>{location.href=it.id==='index'?'./index.html':encodeURIComponent(it.id)+'.html'};
 pop.classList.add('show');document.getElementById('hint').style.opacity=0;}
function hidePop(){pop.classList.remove('show');document.querySelectorAll('.isle.sel').forEach(x=>x.classList.remove('sel'))}
document.getElementById('pop-close').onclick=hidePop;
/* ————— 目录 ————— */
const sheet=document.getElementById('sheet'),groups=document.getElementById('sheet-groups');
const grouped=[['纸 屿',['fuguang','huajian','guzhe','magazine','petal-post-return','ukiyo','relics']],
 ['手 作 屿',['stitch','origami','zipbag','food','retro-green-emoji']],
 ['光 影 屿',['collage','yan','sunlit','dark','pink-paint','lake']],
 ['新 鲜 小 岛',['xiuzi','xiaowu','zhiwen','image-ai-enhance','theme']],
 ['灯 塔',['index']]];
const byId=Object.fromEntries([...ISLES,LIGHT].map(i=>[i.id,i]));
groups.innerHTML=grouped.map(([t,ids])=>'<h3>'+t+'</h3><div class="links">'+ids.map(id=>{const i=byId[id];return '<a href="'+(id==='index'?'./index.html':encodeURIComponent(id)+'.html')+'" class="'+(i.fresh?'new':'')+'"><b>'+i.name+'</b><small>'+(i.sub||'')+'</small></a>'}).join('')+'</div>').join('');
document.getElementById('catalog').onclick=()=>sheet.classList.add('show');
document.getElementById('sheet-close').onclick=()=>sheet.classList.remove('show');
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('show')});
addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();sheet.classList.remove('show')}});
setTimeout(()=>{document.getElementById('hint').style.opacity=0},9000);
fit();
})();
</script>
