<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#dcebf2">
<meta name="description" content="咕的鸽群：每只鸽子衔着一张小卡片，卡片就是每间小屋的门。点卡片，鸽子松嘴送你过去。">
<title>咕的鸽群 · 咕の返图</title>
<style>
:root{--ink:#4c4035;--muted:#7d7668;--paper:#f6efe2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#cfe4ef 0%,#e6f0ee 38%,#f7eeda 78%,#f5e3c8 100%)}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}
#viewport{position:fixed;inset:0;touch-action:none;overflow:hidden}
#flock{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
/* ———— 天空装饰 ———— */
.sun{position:fixed;top:9%;right:11%;width:120px;height:120px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,#ffe9b8 0%,#ffe9b855 45%,transparent 70%)}
.cloud{position:fixed;border-radius:50%;background:#fffdf8;opacity:.75;filter:blur(2px);pointer-events:none;animation:drift var(--cd,60s) linear infinite}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
.gull{position:fixed;color:#8ca3ad;font-size:15px;pointer-events:none;animation:gfly var(--gd,26s) linear infinite}
@keyframes gfly{from{transform:translate(-8vw,var(--gy))}to{transform:translate(108vw,var(--gy))}}
/* ———— 鸽子 + 卡片 ———— */
.unit{position:absolute;left:0;top:0}
.unit .fly{transform:translate(-170vw,var(--fy,-6vh));opacity:0;transition:transform 1.6s cubic-bezier(.2,.85,.25,1) var(--d),opacity .8s ease var(--d)}
.unit.in .fly{transform:none;opacity:1}
.bob{animation:bob var(--bt,5.4s) ease-in-out infinite;animation-delay:var(--bd)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
.dove{position:absolute;left:-78px;top:-46px;width:156px;transition:transform .9s cubic-bezier(.4,0,.6,1),opacity .9s;filter:drop-shadow(0 8px 14px #55667733)}
.dove .wing{transform-box:view-box;transform-origin:60px 52px;animation:flap var(--ft,1.05s) ease-in-out infinite;animation-delay:var(--bd)}
@keyframes flap{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(15deg)}}
.card{position:absolute;left:14px;top:-6px;width:98px;transform:rotate(-4deg);background:#fdfaf2;border:1px solid #e4d7c2;border-radius:7px;
 padding:5px 5px 6px;box-shadow:0 12px 26px #5a4a302e;cursor:pointer;color:var(--ink);text-decoration:none;
 transition:transform .3s,box-shadow .3s,opacity .5s}
.card:hover{transform:rotate(-1deg) translateY(-4px) scale(1.05);box-shadow:0 18px 34px #5a4a3040;z-index:5}
.card .pic{display:block;width:100%;height:70px;border-radius:4px;object-fit:cover;background:#e9e2d4}
.card .fb{display:grid;place-items:center;width:100%;height:70px;border-radius:4px;font:26px/1 Georgia,serif;color:#fffef9;text-shadow:0 1px 3px #0003}
.card b{display:block;font-size:11.5px;font-weight:650;margin-top:5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card i{display:block;font-size:9.5px;color:var(--muted);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grip{position:absolute;top:-7px;left:-9px;width:16px;height:16px;transform:rotate(-32deg);
 background:#e8d9b8;clip-path:polygon(50% 0,100% 100%,0 100%)}
.fresh{position:absolute;top:-8px;right:-9px;transform:rotate(8deg);background:#c96f52;color:#fff8ec;font-size:9.5px;
 padding:2px 7px;border-radius:9px;letter-spacing:.08em;box-shadow:0 4px 10px #0002}
/* 放飞动画 */
.unit.go{pointer-events:none;z-index:40}
.unit.go .dove{transform:translate(72vw,-34vh) rotate(-12deg) scale(.9);opacity:0;transition-duration:1.05s}
.unit.go .card{transform:rotate(-14deg) translateY(64px);opacity:0;transition:transform .55s ease-in,opacity .45s}
/* 卡片放大过渡 */
.veil{position:fixed;inset:0;background:#fdfaf2;opacity:0;pointer-events:none;transition:opacity .5s .25s;z-index:98}
.veil.on{opacity:1}
.zoom-card{position:fixed;z-index:99;background:#fdfaf2;border-radius:10px;box-shadow:0 24px 60px #5a4a3050;overflow:hidden;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
 transition:left .62s cubic-bezier(.5,0,.2,1),top .62s cubic-bezier(.5,0,.2,1),width .62s cubic-bezier(.5,0,.2,1),height .62s cubic-bezier(.5,0,.2,1),border-radius .62s}
.zoom-card img{max-width:100%;max-height:100%}
/* ———— 中央标题 ———— */
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:300px}
.hero .mark{font:600 44px/1.1 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:8px;color:#5a4a38;text-shadow:0 2px 0 #fff8}
.hero p{margin:8px 0 0;font-size:12px;color:#6b6253;letter-spacing:.12em}
.hero .divider{width:56px;height:1px;background:#b9a98866;margin:10px auto}
/* ———— HUD ———— */
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;z-index:60;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:flex;gap:10px;align-items:center;background:#fffaf0d9;border:1px solid #e0d2b8;border-radius:16px;padding:8px 14px;backdrop-filter:blur(6px)}
.chip .m{width:30px;height:30px;border:1px solid #b7a99a;border-radius:50%;display:grid;place-items:center;font:18px Georgia,serif;color:#7a5c40}
.chip h1{font:600 15px "Songti SC",serif;letter-spacing:3px;margin:0}
.chip small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted)}
.hbtn{min-height:38px;padding:8px 15px;border-radius:12px;background:#fdfaf0e0;border:1px solid #ddcfb4;font-size:12.5px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.hbtn:hover{background:#fff}
.hbtns{display:flex;gap:8px}
.hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#4c4035d0;color:#f4ecd8;
 border-radius:20px;padding:7px 16px;font-size:12px;z-index:60;pointer-events:none;transition:opacity .8s;white-space:nowrap}
/* ———— 目录 ———— */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:#3d322750;backdrop-filter:blur(3px)}
.sheet-box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,96vw);max-height:74svh;overflow-y:auto;
 background:#fdfaf2;border:1px solid #e0d2b8;border-radius:22px 22px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #4f3f2c33}
.sheet-box h3{font:600 13px "Songti SC",serif;letter-spacing:.2em;color:#8a7257;margin:14px 0 9px}
.sheet-box h3:first-child{margin-top:0}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.links a{display:block;padding:9px 11px;border:1px solid #e4d9c4;border-radius:11px;text-decoration:none;color:var(--ink);background:#fff}
.links a b{font-size:12.5px;display:block}
.links a small{font-size:10px;color:var(--muted)}
.links a.new{border-color:#e0ac8c;background:#fdf2e4}
.sheet-x{float:right;min-width:36px;min-height:36px;border-radius:50%;background:#f0e8d6;font-size:16px}
@media(max-width:640px){.dove{left:-64px;top:-38px;width:128px}.card{left:8px;top:-2px;width:82px}.card .pic,.card .fb{height:58px}.hero .mark{font-size:30px;letter-spacing:5px}.hero{width:200px}.hero p{font-size:10.5px}.chip small{display:none}}
@media(prefers-reduced-motion:reduce){.unit .fly{transition:none}.bob,.dove .wing,.cloud,.gull{animation:none}.zoom-card,.veil{transition-duration:.01s}}
</style>
</head>
<body>
<div class="sun"></div>
<div id="viewport"><div id="flock"></div></div>
<div class="hud">
 <div class="chip"><span class="m">鸽</span><div><h1>咕的鸽群</h1><small>COURIER DOVES · PICK A CARD</small></div></div>
 <div class="hbtns"><button class="hbtn" id="btn-sheet">全部小屋</button><a class="hbtn" href="./index.html">返图画册 →</a></div>
</div>
<div class="hint" id="hint">点卡片，鸽子松嘴送你过去 · 拖动看看四周</div>
<div id="sheet"><div class="sheet-bg"></div>
 <div class="sheet-box"><button class="sheet-x" id="sheet-x" aria-label="关闭">×</button>
  <h3>✨ 新做的小屋</h3><div class="links" id="links-new"></div>
  <h3>全部小屋</h3><div class="links" id="links-all"></div>
 </div></div>
<div class="veil" id="veil"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const COVER='assets/gallery-covers/';
const ITEMS=[
 {id:'xiuzi',name:'绣字铺',sub:'把字一针一线绣在布上',fresh:1,sym:'绣',c:['#983e32','#5e2922']},
 {id:'xiaowu',name:'布置小屋',sub:'家具摆一摆，安个小家',fresh:1,sym:'屋',c:['#b98d5f','#7a5c40']},
 {id:'fuguang',name:'浮光碎影',sub:'碎片 · 光影 · 拼贴',sym:'✳',c:['#78948c','#e5dfc8']},
 {id:'collage',name:'散漫ins风',sub:'随性 · 胶片 · 照片墙',sym:'◒',c:['#c9b29d','#efdcd0']},
 {id:'guzhe',name:'古风折页',sub:'折页 · 金线 · 古纸',sym:'折',c:['#55644f','#e4d2a5']},
 {id:'stitch',name:'缝合艺术',sub:'绣线 · 针脚 · 手作',sym:'✣',c:['#b77d7b','#eed3c1']},
 {id:'sunlit',name:'天气好',sub:'晴日 · 轻快 · 明信片',sym:'☼',c:['#9cbdb5','#f5d9a2']},
 {id:'food',name:'零食小铺',sub:'零食包装 · 小店趣味',sym:'♡',c:['#d8b2a7','#f7ead6']},
 {id:'zipbag',name:'拉链袋',sub:'透明材质 · 透明封装',sym:'▧',c:['#a0bbbf','#e8e6d6']},
 {id:'magazine',name:'旧刊杂志',sub:'编辑排版 · 复古刊物',sym:'M',c:['#a49583','#e5dac2']},
 {id:'huajian',name:'花笺',sub:'花叶 · 纸品 · 书信',sym:'❦',c:['#6e9880','#e6ead9']},
 {id:'origami',name:'东南西北',sub:'立体折纸 · 双面展开',sym:'◇',c:['#7895b8','#e7d5cc']},
 {id:'petal-post-return',name:'折花寄影',sub:'花瓣 · 纸张 · 折叠',sym:'❀',c:['#b89aab','#efe2d7']},
 {id:'yan',name:'焰',sub:'暖色 · 炽光 · 层叠',sym:'✧',c:['#a55a43','#edc49e']},
 {id:'theme',name:'主题预览专供',sub:'主题截图 · 动态展示',sym:'▣',c:['#506b6a','#adbfc1']},
 {id:'pink-paint',name:'千禧桌面',sub:'复古画图 · CRT 闪烁',sym:'▣',c:['#e4aec9','#dbb6c8']},
 {id:'lake',name:'湖中倒影',sub:'细雪 · 水波倒影',sym:'≈',c:['#779ac3','#dae8f3']},
 {id:'retro-green-emoji',name:'古早绿色emoji',sub:'韩系复古 · 摇摇贴纸',sym:'☻',c:['#b6e581','#f8f8ec']},
 {id:'dark',name:'信号丢失',sub:'故障美学 · 雾面玻璃',sym:'⌁',c:['#242933','#85829b']},
 {id:'ukiyo',name:'浮世三景',sub:'和风 · 屏风 · 花瓣',sym:'三',c:['#355e75','#c6a18a']},
 {id:'relics',name:'绣样帖',sub:'布绣 · 拼布 · 古董样帖',sym:'帖',c:['#29464a','#e9dfd0']},
 {id:'zhiwen',name:'纸纹研究室',sub:'纸张纹理 · 调色实验',sym:'纸',c:['#8c7a5c','#e8dcc0']},
 {id:'image-ai-enhance',name:'AI 图片修复',sub:'老照片 · 变清晰',sym:'✚',c:['#7a8fa0','#dfe8ee']}
];
const dove=`<svg class="dove" viewBox="0 0 160 92" aria-hidden="true">
 <path d="M26 46 Q2 44 -12 34 Q4 52 24 54" fill="#e9e3d6"/>
 <path d="M28 50 Q6 52 -6 48 Q8 60 26 56" fill="#ded7c8"/>
 <path d="M22 48 Q40 24 78 24 Q110 24 120 36 Q130 26 142 26 Q152 26 156 34 Q144 34 140 42 Q146 52 134 60 Q110 72 76 70 Q46 68 22 48 Z" fill="#fdfbf5" stroke="#d9d2c2" stroke-width="1.6"/>
 <g class="wing"><path d="M60 52 Q78 18 118 12 Q104 40 84 54 Q72 58 60 52 Z" fill="#ece7db" stroke="#d4cdbd" stroke-width="1.4"/></g>
 <path d="M154 33 L170 36 L154 42 Z" fill="#d9a648"/>
 <circle cx="142" cy="33" r="2.6" fill="#4c4035"/>
</svg>`;
const flock=$('#flock'),vp=$('#viewport'),mobile=matchMedia('(max-width:640px)');
/* 编排队形：外环衔小卡，中上方站标题 */
function slots(){const n=ITEMS.length;
 let rx,ry;if(mobile.matches){rx=430;ry=330}else{rx=Math.min(innerWidth*.44,540);ry=Math.min(innerHeight*.36,340)}
 rx=Math.max(rx,300);ry=Math.max(ry,240);
 return ITEMS.map((it,i)=>{const t=-Math.PI/2+i/n*Math.PI*2;
  const rr=i%2?0.92:1.02;
  return{x:Math.cos(t)*rx*rr,y:Math.sin(t)*ry*rr}});}
function cardHTML(it){const pic=`<span class="fb" style="background:linear-gradient(135deg,${it.c[0]},${it.c[1]})">${it.sym}</span>`;
 return`<span class="grip"></span><img class="pic" src="${COVER+it.id}.webp" alt="" loading="lazy" onerror="this.outerHTML=this.dataset.fb" data-fb='${pic.replace(/'/g,"&#39;")}'><b>${it.name}</b><i>${it.sub}</i>${it.fresh?'<span class="fresh">新</span>':''}`;}
const pos=slots(),units=[];
ITEMS.forEach((it,i)=>{
 const u=document.createElement('div');u.className='unit';u.style.transform=`translate(${pos[i].x}px,${pos[i].y}px)`;
 u.style.setProperty('--d',(0.25+i*0.11)+'s');u.style.setProperty('--bd',(-i*0.7)+'s');
 u.style.setProperty('--r',((i%5)-2)*1.6+'deg');u.style.setProperty('--fy',((i%4)-2)*4+'vh');
 u.innerHTML=`<div class="fly"><div class="bob">${dove}<a class="card" href="./${it.id}.html" data-id="${it.id}">${cardHTML(it)}</a></div></div>`;
 flock.append(u);units.push(u);});
/* 中央标题 */
const hero=document.createElement('div');hero.className='hero';
hero.innerHTML='<div class="mark">咕的鸽群</div><div class="divider"></div><p>每只鸽子衔着一张卡片<br>卡片就是每间小屋的门</p>';
flock.append(hero);
/* 云朵与远鸟 */
const vpEl=vp;[['8%',260,26,9],['30%',380,34,14],['58%',300,30,11],['80%',420,40,18]].forEach((c,i)=>{
 const d=document.createElement('div');d.className='cloud';d.style.cssText=`top:${c[0]};width:${c[1]}px;height:${c[1]*.32}px;left:-20vw;--cd:${46+i*17}s;animation-delay:${-i*13}s`;vpEl.append(d)});
[['12%',18],['22%',11],['70%',15]].forEach((g,i)=>{const d=document.createElement('div');d.className='gull';d.textContent='∿';d.style.cssText=`--gy:${g[0]};font-size:${g[1]}px;--gd:${22+i*9}s;animation-delay:${-i*8}s;top:0`;vpEl.append(d)});
/* 平移 */
let tx=0,ty=0,downAt=0,moved=false,px=0,py=0,dx0=0,dy0=0,down=false;
function apply(){flock.style.transform=`translate(${tx}px,${ty}px)`}
function bounds(){const bx=Math.max(...pos.map(p=>Math.abs(p.x)))+160-vp.clientWidth/2,by=Math.max(...pos.map(p=>Math.abs(p.y)))+140-vp.clientHeight/2;
 tx=Math.max(-Math.max(bx,40),Math.min(Math.max(bx,40),tx));ty=Math.max(-Math.max(by,40),Math.min(Math.max(by,40),ty))}
vp.addEventListener('pointerdown',e=>{down=true;moved=false;px=e.clientX-tx;py=e.clientY-ty;dx0=e.clientX;dy0=e.clientY;downAt=performance.now();vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!down)return;const nx=e.clientX-px,ny=e.clientY-py;
 if(Math.hypot(e.clientX-dx0,e.clientY-dy0)>6)moved=true;tx=nx;ty=ny;bounds();apply()});
vp.addEventListener('pointerup',e=>{down=false;
 if(e.button===0&&performance.now()-downAt<400&&!moved){const el=document.elementFromPoint(e.clientX,e.clientY),card=el&&el.closest('.card');
  if(card){e.preventDefault();release(card)}}});
/* 后退回来时清掉残留的放大层，页面保持可点 */
addEventListener('pageshow',e=>{if(e.persisted){document.querySelector('.zoom-card')?.remove();document.querySelector('#veil').classList.remove('on');document.querySelectorAll('.unit.go').forEach(u=>u.classList.remove('go'))}});
flock.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;e.preventDefault();release(c)});
/* 点卡片：鸽子松嘴 → 卡片放大 → 进小屋 */
function release(card){if(document.querySelector('.zoom-card'))return;
 const unit=card.closest('.unit');unit.classList.add('go');
 const r=card.getBoundingClientRect(),clone=document.createElement('div');clone.className='zoom-card';
 clone.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
 const img=card.querySelector('.pic');clone.innerHTML=img?`<img src="${img.src}" style="width:100%;height:100%;object-fit:cover">`:`<div style="font:600 34px 'Songti SC',serif;color:#5a4a38">${card.querySelector('b').textContent}</div>`;
 document.body.append(clone);$('#veil').classList.add('on');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  clone.style.cssText=`left:0;top:0;width:100vw;height:100vh;border-radius:0`}));
 setTimeout(()=>{location.href=card.getAttribute('href')},860);}
/* 目录 */
$('#links-new').innerHTML=ITEMS.filter(i=>i.fresh).map(linkHTML).join('');
$('#links-all').innerHTML=ITEMS.map(linkHTML).join('')+`<a href="./index.html"><b>返图画册</b><small>画廊式首页 · 全部模板</small></a>`;
function linkHTML(i){return`<a href="./${i.id}.html" class="${i.fresh?'new':''}"><b>${i.name}</b><small>${i.sub}</small></a>`}
$('#btn-sheet').onclick=()=>$('#sheet').classList.add('open');
$('#sheet-x').onclick=()=>$('#sheet').classList.remove('open');
document.querySelector('.sheet-bg').onclick=()=>$('#sheet').classList.remove('open');
/* 入场 */
requestAnimationFrame(()=>units.forEach(u=>u.classList.add('in')));
setTimeout(()=>{$('#hint').style.opacity=0},7000);
})();
</script>
</body>
</html>
